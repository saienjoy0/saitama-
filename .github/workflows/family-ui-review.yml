name: Family UI review
on:
  pull_request:
    paths:
      - 'docs/review/family-ui-handoff-20261008/**'
      - 'tests/review/**'
      - '.github/workflows/family-ui-review.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/review/package-lock.json
      - run: npm ci --prefix tests/review
      - run: npx playwright install --with-deps chromium
        working-directory: tests/review
      - run: npm test --prefix tests/review
      - run: python3 scripts/check_design_handoff.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-ui-browser-evidence
          path: docs/review/family-ui-handoff-20261008/evidence/
