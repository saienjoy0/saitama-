name: Assemble legacy application DOCX

on:
  push:
    branches:
      - add-final-legacy-application
    paths:
      - '.tmp-upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: add-final-legacy-application
          fetch-depth: 0

      - name: Reconstruct and validate DOCX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p 'archive/original-documents'
          cat .tmp-upload/chunk_00 .tmp-upload/chunk_01 .tmp-upload/chunk_02 .tmp-upload/chunk_03 .tmp-upload/chunk_04 .tmp-upload/chunk_05 | base64 -d > 'archive/original-documents/ｚ世代代表　武田怜雨_GitHub保存版.docx'
          test "$(stat -c%s 'archive/original-documents/ｚ世代代表　武田怜雨_GitHub保存版.docx')" -eq 34613
          unzip -t 'archive/original-documents/ｚ世代代表　武田怜雨_GitHub保存版.docx'

      - name: Commit reconstructed DOCX
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'archive/original-documents/ｚ世代代表　武田怜雨_GitHub保存版.docx'
          git diff --cached --quiet && exit 0
          git commit -m 'Add Word copy of final Kitakyushu application'
          git push origin HEAD:add-final-legacy-application
