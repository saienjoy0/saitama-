name: Market validation harness — offline guardrail
on:
  pull_request:
    paths:
      - "research/market-validation/**"
      - ".agents/skills/**"
      - ".agents/product-marketing.md"
      - "THIRD_PARTY_LICENSES/**"
      - ".github/workflows/market-validation-offline.yml"
  workflow_dispatch:
jobs:
  offline-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run all 16-cell / evidence / restart gate tests
        run: python3 -m unittest discover -s research/market-validation -p 'test_*.py' -v
      - name: Compile runner
        run: python3 -m py_compile research/market-validation/harness.py research/market-validation/work48.py research/market-validation/skill_router.py research/market-validation/simulate.py
      - name: Validate pinned upstream/bootstrap shell syntax
        run: bash -n research/market-validation/checkout-upstream.sh research/market-validation/install-marketing-skills.sh
      - name: Verify all imported skills against pinned source blobs
        run: python3 research/market-validation/skill_router.py audit
      - name: Verify skill mapping and run hypothetical simulation
        run: |
          python3 research/market-validation/skill_router.py route --round 37
          python3 research/market-validation/simulate.py --output /tmp/yattemi-hypothetical.json
          python3 -c 'import json; d=json.load(open("/tmp/yattemi-hypothetical.json")); assert d["source_type"]=="SYNTHETIC_SCENARIO" and d["observed_customer_count"]==0 and d["not_a_forecast"]'
      - name: Validate config and current research status
        run: |
          python3 -m json.tool research/market-validation/config.json > /dev/null
          python3 -m json.tool research/market-validation/state.json > /dev/null
          python3 -m json.tool research/market-validation/work48_plan.json > /dev/null
          python3 -m json.tool research/market-validation/work48_state.json > /dev/null
          python3 research/market-validation/harness.py status
          python3 research/market-validation/work48.py doctor
          python3 research/market-validation/work48.py status
