<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>GAKU∞STA Prototype</title>
<style>
body{font-family:sans-serif;background:#f6f7fb;padding:30px}
.card{background:white;border-radius:20px;padding:24px;margin:20px 0;box-shadow:0 5px 20px #ddd}
button{padding:12px 20px;border-radius:12px;border:0;background:#222;color:white;margin:5px}
.tag{background:#eee;padding:6px 12px;border-radius:20px}
</style>
</head>
<body>
<h1>やってみクエスト</h1>
<div class="card">
<span class="tag">今日の金融体験</span>
<h2>欲しいゲームが3000円</h2>
<p>今持っているお金は1500円。</p>
<button>今買う</button>
<button>貯める</button>
<button>別の方法を考える</button>
</div>
<div class="card">
<h2>AIコーチ</h2>
<p>答えを決める前に考えてみよう。</p>
<p>「どうして欲しいと思った？」</p>
</div>
<div class="card">
<h2>成長マップ</h2>
<p>使う・選ぶ ★★★☆☆</p>
<p>貯める ★★☆☆☆</p>
<p>価値を生む ★★★☆☆</p>
</div>
</body>
</html>
