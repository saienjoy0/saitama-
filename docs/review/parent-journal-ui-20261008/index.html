<body><div id="app">
<div class="notice-bar">発表・検証用の合成デモです。実際の家族への送信やAI生成は行いません。</div>
<header class="header"><div class="logo"><span class="mark" aria-hidden="true">✧</span>家族のおたより</div><span class="role">保護者の画面</span></header>
<div class="viewport" id="viewport"><main class="content" id="main" aria-live="polite"></main></div>
<nav class="bottom" aria-label="親の画面メニュー">
<button class="tab" data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11 12 4l8 7v9H4zM9 20v-6h6v6" stroke-linejoin="round"/></svg>今日</button>
<button class="tab" data-tab="album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>アルバム</button>
<button class="tab" data-tab="family"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><path d="M3 20v-3a6 6 0 0 1 12 0v3M17 10a3 3 0 1 0-2-5.2M17 14a5 5 0 0 1 4 5v1"/></svg>家族</button>
</nav><div id="portal"></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),main=$('#main'),viewport=$('#viewport'),portal=$('#portal');
const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW='10月8日';
const sources={
 a1:{by:'はるちゃんの発言',type:'本人の言葉',text:'「献立も買うものも自分で決めたい。今までは頼まれたものだけ買っていた」'},
 a2:{by:'はるちゃんの報告',type:'家族への質問（本人の報告）',text:'「予算に入らなかったら、料理を変えてもいい？」と家族に質問したと話した。'},
 a3:{by:'保護者が確認（デモ）',type:'親子で合意した約束',text:'一食から。献立と買うものを子どもが考え、人数・予算・店や道は家族と確認、調理は一緒に行う。'},
 a4:{by:'はるちゃんの発言',type:'次にしたいこと',text:'「まずは料理の前の仕事を調べてみたい」'},
 b1:{by:'はるちゃんの発言',type:'本人の言葉',text:'「料理と買い物をしたら夕飯になると思ってた」'},
 b2:{by:'はるちゃんの報告',type:'家族に聞いた内容（伝聞）',text:'料理前には在庫確認や献立決めがある。父は仕事帰りに店に寄ることがある、と家族から聞いたと報告。'},
 b3:{by:'はるちゃんの発言',type:'最初の提案',text:'「家にある材料をお父さんに伝えよう」'},
 b4:{by:'はるちゃんの報告',type:'父の返答（本人の伝聞）',text:'「店に入ったあとでは遅いよ」と父に言われたと話した。父本人の直接記録ではない。'},
 b5:{by:'はるちゃんの発言',type:'修正した提案',text:'「寄る日を先に聞いて、出発する前に材料を伝えよう」'},
 b6:{by:'はるちゃんの報告',type:'実行報告',text:'米、玉ねぎ、にんじん、ルーを確認し、出発前に知らせる方法を一回試したと報告。'},
 c1:{by:'家族と確認した条件（合成例）',type:'実行条件',text:'4人分・買い足し予算1,000円・16:45までに帰宅・親と調理する約束。'},
 c2:{by:'はるちゃんの報告',type:'店を調べた情報（本人の報告）',text:'同じ買うものについてB店920円・A店980円と調べたと報告。実際の店頭価格は未照合。'},
 c3:{by:'はるちゃんの報告',type:'家族の返答（本人の伝聞）',text:'父に迎えをお願いしたところ、A店なら16:30、B店なら17:00と返答があったと報告。'},
 c4:{by:'はるちゃんの発言',type:'本人の選択',text:'「B店の方が安いけど、今日は帰る時間を考えてA店にしたよ」'},

function render(){document.querySelectorAll('[data-tab]').forEach(n=>{const active=n.dataset.tab===state.tab;if(active)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current')});main.innerHTML=state.screen==='article'?renderArticle():state.tab==='today'?renderHome():state.tab==='album'?renderAlbum():renderFamily();}
function tab(v){state.tab=v;state.screen='home';viewport.scrollTop=0;render()}
function openArticle(id){if(!records.some(x=>x.id===id))return;state.articleId=id;state.returnTab=state.tab;state.returnScroll=viewport.scrollTop;state.screen='article';viewport.scrollTop=0;render()}
function back(){state.screen='home';state.tab=state.returnTab;render();viewport.scrollTop=state.returnScroll}
function modal(kind){state.modal=kind;const isReward=kind==='reward';const title=isReward?'カフェのごほうびを交換':'夕飯づくりの達成を確認';const body=isReward?'<p>はるちゃんから「カフェに行きたい」という50Pの交換依頼が届きました。</p><div class="outcome"><h3>確認する内容</h3><p>現在の確定ポイント：60P（初回0P + 調査20P + 夕飯40P）。交換予約：50P。残り10P。</p><p class="tiny">費用や日程は家庭で別途相談。ポイントの交換承認と実際にカフェへ行くことは別です。</p></div>':'<p>はるちゃんから「買い物をして家族とカレーを作った」という報告が届きました。</p><div class="outcome"><h3>家族で約束した条件（合成例）</h3><p>4人分の夕飯／食材の買い足し予算1,000円／16:45までに帰宅／調理は家族と一緒。達成したと確認した場合のみ40Pを確定します。</p><p class="tiny">本人の報告だけでは親による確認は完了していません。</p></div>';
portal.innerHTML='<div class="dialogBackdrop"><div class="dialogCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="kicker">保護者が判断すること · 合成デモ</div><h2 id="modalTitle">'+title+'</h2>'+body+'<div class="checkRow"><input type="checkbox" id="verified"><label for="verified">内容と条件を確認しました。これはデモ上の判断です。</label></div><div class="dialogActions"><button class="btn primary full" data-action="'+(isReward?'accept-reward':'accept-confirm')+'" id="acceptBtn" disabled>'+(isReward?'50Pの交換を承認（デモ）':'40Pの達成を確認（デモ）')+'</button><button class="btn white full" data-action="close-modal">あとで確認する</button></div></div></div>';$('#verified').focus();}
function closeModal(){portal.innerHTML='';state.modal=null;}
function toast(msg){let t=$('#toast');if(t)t.remove();const el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');el.textContent=msg;$('#app').append(el);setTimeout(()=>{if(el.isConnected)el.remove()},2700)}
function onAction(action){const [kind,arg]=action.split(':');if(kind==='tab'){tab(arg);return}if(kind==='article'){openArticle(arg);return}if(kind==='back'){back();return}if(kind==='person'){tab('family');return}if(kind==='source'){const d=$('#sourcesDetail');if(d){d.open=true;const node=document.getElementById('src-'+arg);if(node)node.scrollIntoView({block:'center',behavior:'smooth'})}return}if(kind==='filter'){state.filter=arg;render();return}if(kind==='confirm'){modal('confirm');return}if(kind==='reward'){modal('reward');return}if(kind==='close-modal'){closeModal();return}if(kind==='accept-confirm'){if(!$('#verified')?.checked)return;state.confirmC=true;closeModal();render();toast('夕飯の達成を確認しました（デモ）');return}if(kind==='make-reward'){if(!state.confirmC||state.rewardRequested)return;state.rewardRequested=true;render();toast('はるちゃんの50Pごほうび依頼を追加しました');return}if(kind==='accept-reward'){if(!$('#verified')?.checked||!state.confirmC||!state.rewardRequested)return;state.rewardReserved=true;closeModal();render();toast('50Pの交換を承認しました（提供はまだです）');return}if(kind==='genki-grandpa'){state.grandpa.genki=true;render();toast('祖父の合成近況を反映しました');return}if(kind==='reset'){state.confirmC=false;state.rewardRequested=false;state.rewardReserved=false;state.grandpa.genki=false;state.grandma.genki=true;state.grandma.steps=5200;state.filter='すべて';state.query='';state.screen='home';state.tab='today';render();viewport.scrollTop=0;toast('合成デモを初期状態に戻しました');}}
$('#app').addEventListener('click',e=>{const tabBtn=e.target.closest('[data-tab]');if(tabBtn){tab(tabBtn.dataset.tab);return}const a=e.target.closest('[data-action]');if(a){onAction(a.dataset.action);return}if(e.target.classList.contains('dialogBackdrop'))closeModal()});
$('#app').addEventListener('change',e=>{if(e.target.id==='verified'){const b=$('#acceptBtn');if(b)b.disabled=!e.target.checked}});
$('#app').addEventListener('input',e=>{if(e.target.id==='albumSearch'){const p=e.target.selectionStart;state.query=e.target.value;render();let n=$('#albumSearch');if(n){n.focus();n.setSelectionRange(p,p)}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();else if(e.key==='Escape'&&state.screen==='article')back()});
window.YattemiParentDemo={getState:()=>({tab:state.tab,screen:state.screen,articleId:state.articleId,confirmed:state.confirmC,pending:pendingCount(),rewardRequested:state.rewardRequested,rewardReserved:state.rewardReserved}),openArticle,goTab:tab,reset:()=>onAction('reset'),getSources:()=>JSON.parse(JSON.stringify(sources))};
render();
})();
</script>
</body></html>
