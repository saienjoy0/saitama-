function family(){return `<div class="pageintro"><div class="eyebrow">FAMILY LETTER</div><h1>家族の近況<span style="color:#a5bc9f">。</span></h1><p>おじいちゃん・おばあちゃんが自分で送った記録です。</p></div><section class="familyPageCard"><div class="familyName"><span class="personIcon">👵</span><div><h2>おばあちゃん</h2><div class="caption">最近の連絡：今日 12:06（サンプル）</div></div></div><div class="metricLine"><div class="metric"><span>今日のひとこと</span><b>${state.genkiGrandma?'元気だよ':'連絡未着'}</b></div><div class="metric"><span>今日の歩数</span><b>${state.stepsGrandma===null?'記録未着':state.stepsGrandma.toLocaleString('ja-JP')+'歩'}</b><span>本人の手入力</span></div></div><details class="details"><summary>以前の記録</summary><div class="detailsContent"><div class="historyItem"><strong class="sm">10月7日</strong><p>元気だよ · 5,200歩（手入力）</p></div><div class="historyItem"><strong class="sm">10月5日</strong><p>元気だよ · 歩数記録なし</p></div></div></details></section><section class="familyPageCard"><div class="familyName"><span class="personIcon">👴</span><div><h2>おじいちゃん</h2><div class="caption">前回の連絡：昨日 19:10</div></div></div><div class="metricLine"><div class="metric"><span>今日のひとこと</span><b>まだ連絡なし</b></div><div class="metric"><span>今日の歩数</span><b>記録未着</b></div></div><p class="caption" style="margin-top:10px">連絡がないことや歩数の少なさだけでは、健康や安全は判断できません。</p></section><div class="simplePanel"><strong>本人からのお知らせ</strong><p>「元気だよ」は本人が送った近況です。自動的な安否確認・健康診断ではありません。</p></div>${demoPanel()}`}
function moduleHtml(a,m){for(const id of m.refs)if(!evidence[id])return'';let inner='';if(m.kind==='comparison')inner=`<div class="journey"><div class="journeyStep"><span class="journeyIndex">1</span><div class="journeyCopy"><strong>最初に選んだのは</strong><p>買い物が920円のB店。</p></div></div><div class="journeyStep"><span class="journeyIndex">2</span><div class="journeyCopy"><strong>お父さんに聞いてみた</strong><p>B店なら迎えは17:00。家族の約束は16:45までの帰宅。</p></div></div><div class="journeyStep"><span class="journeyIndex">3</span><div class="journeyCopy"><strong>そこで選び直した</strong><p>60円高くても、迎えが16:30のA店を選んだと本人が報告。</p></div></div></div><details class="compareDetails"><summary>2つのお店の数字を比べる</summary><div class="compare"><div class="option highlight"><div class="name">選んだA店</div><div class="money">980円</div><div class="details">迎え 16:30<br>帰宅に合う見込み</div></div><div class="option"><div class="name">候補 B店</div><div class="money">920円</div><div class="details">迎え 17:00<br>帰宅の約束に合わない</div></div></div><div class="sourceNote">迎えの時刻は、はるちゃんから聞いた父の返答です（父本人は未確認）。</div></details>`;
else if(m.kind==='revision')inner=`<div class="changeRow"><span class="caption">最初の案</span><p class="sm" style="margin:6px 0 0">家にある材料をお父さんに伝える</p></div><div class="changeArrow">↓</div><div class="changeRow"><span class="caption">お父さんの返事（はるちゃんからの報告）</span><p class="sm" style="margin:6px 0 0">店に入った後では遅い</p></div><div class="changeArrow">↓</div><div class="changeRow" style="background:#eaf3e9"><span class="caption">考え直した案</span><p class="sm" style="margin:6px 0 0">買い物の日を先に聞き、出発前に伝える</p></div>`;
else if(m.kind==='agreement')inner=`<table class="agreementTable"><tr><td>自分で考える</td><td>献立・買うもの</td></tr><tr><td>当日相談</td><td>人数・予算・店や道</td></tr><tr><td>家族と一緒</td><td>調理</td></tr></table><div class="sourceNote">この約束は保護者が確認した合成記録です。</div>`;
else inner=`<p class="sm" style="margin:0">${safe(m.text)}</p>`;
return `<section class="storyModule"><div class="moduleTitle">${safe(m.label)}</div>${inner}<div class="sourceNote">もとの記録：${m.refs.length}件 · <button class="button text" data-action="evidence:${a.id}:${m.refs.join(',')}" style="min-height:34px;font-size:11px">出所を確認する ›</button></div></section>`}
function digest(a){
const info={
 s3:{what:'カレーの材料を考え、買い物と料理をしたと報告',why:'店の値段と、お父さんの迎えの時間を比べてA店へ変更',whatRefs:['c31','c36'],whyRefs:['c32','c33','c34']},
 s2:{what:'夕飯までの仕事を調べ、買い物前の連絡を一度試したと報告',why:'お父さんの都合を聞き、店に入る前に材料を伝える案へ修正',whatRefs:['b21','b22','b25'],whyRefs:['b23','b24']},
 s1:{what:'献立から考えてみたいと家族に相談',why:'人数や予算の決め方を話し合い、変更する時の質問もした',whatRefs:['a11','a12'],whyRefs:['a13']}
}[a.id];
if(!info||![...info.whatRefs,...info.whyRefs].every(id=>evidence[id]))return '';
const renderLine=(label,value,ids)=>`<button type="button" class="digestLine digestLink" data-action="evidence:${a.id}:${ids.join(',')}" aria-label="${safe(label)}：${safe(value)}。もとの記録を見る"><span class="digestLabel">${safe(label)}</span><span class="digestText">${safe(value)}</span><span class="digestLinkIcon" aria-hidden="true">↗</span></button>`;
return `<section class="articleDigest" aria-label="この記事の要点"><div class="digestHeader"><div class="heading"><span class="eyebrow">この記事の要点</span><h2>何をして、どう考えた？</h2></div><div class="digestThumb">${illustration(a.cover)}</div></div><div class="digestLines">${renderLine('やってみた',info.what,info.whatRefs)}${renderLine('考えたこと',info.why,info.whyRefs)}</div></section>`;
}
function parentInsightReport(a){const p=parentInsights[a.id];if(!p)return'';
const ai=p.actualAI && evidence[p.actualAI.question] && evidence[p.actualAI.answer] ? `<section class="aiAsked" aria-label="デモ内でAIが実際に聞いた質問"><div class="aiTag">✦ AIが聞いたこと・本人の答え（架空の会話記録）</div><div class="aiQuestion">AI「${safe(evidence[p.actualAI.question].quote)}」</div><div class="aiAnswer">はる「${safe(evidence[p.actualAI.answer].quote)}」</div><div class="caption">これはAIが本人に聞いた質問と返答が両方残っている場合だけ表示。既存の会話を後付けした実績ではありません。</div><details class="details"><summary>なぜこの質問をしたの？</summary><div class="detailsContent">${safe(p.actualAI.why)}<br><button type="button" class="button text" data-action="evidence:${a.id}:${p.actualAI.whyRefs.join(',')}">質問の前に残っていた記録を見る ›</button></div></details></section>` : '';
const hidden=!!state.hiddenPrompts[a.id];
const prompt= `<section class="conversationCard" aria-label="親子で話せるきっかけ"><div class="conversationHeader"><h2>💬 親子で話せる一言</h2><span class="reportScope">AIの提案</span></div><p class="subtitle">子どもにまだ聞いていない質問です。話しかけるかは自由。</p>${hidden?'<p class="caption" style="margin:11px 0 0">会話の提案は非表示にしました。</p>':`<p class="suggestedQuestion">「${safe(p.talk)}」</p><button class="insightSource" data-action="evidence:${a.id}:${p.talkRefs.join(',')}">この提案の元になった記録を見る ↗</button>`}<button class="promptControl" data-action="prompt:${a.id}">${hidden?'質問をもう一度表示':'今日はこの質問を表示しない'} →</button></section>`;
return `<div class="insightHero" aria-label="今回の工夫"><div class="insightEyebrow"><span class="insightMark">✦</span>親に伝えたい、今回の工夫</div><p class="insightClaim">${safe(p.headline)}</p><p class="insightDesc">${safe(p.explain)}</p><button class="insightSource" data-action="evidence:${a.id}:${p.refs.join(',')}">この内容の元になった記録を見る ↗</button></div>${!ai && a.quoteRef && evidence[a.quoteRef]?`<section class="realVoice"><div class="eyebrow">はるちゃんが自分の言葉で話したこと</div><blockquote>「${safe(evidence[a.quoteRef].quote)}」</blockquote><p class="caption">本人の発言（デモ用の架空記録）</p></section>`:''}${ai}${prompt}`;
}
function newspaperExample(a){const p=parentInsights[a.id];return `<details class="details newspaperToggle"><summary>家族新聞ではどう見える？（編集見本）</summary><div class="detailsContent"><p class="caption">家族新聞はみんなで思い出を楽しむ読み物。親専用の判断メモやAIの質問提案は掲載しません。</p><div class="newspaperSample"><div class="eyebrow">家族新聞 · 未送信の編集見本</div><div class="paperTitle">${safe(p.newsTitle)}</div><p>${safe(p.newsText)}</p></div><button class="button text" data-action="evidence:${a.id}:${p.newsRefs.join(',')}">新聞見本の元の記録を見る ↗</button><p class="caption">この見本は誰にも届きません。実際の公開には、子どもの共有希望と保護者の版・素材・宛先確認が別に必要です。</p></div></details>`}
function story(){const a=articles.find(x=>x.id===state.article)||articles[0];let pending=a.id==='s3'&&state.pending.activity;
return `<div class="article"><button class="back" data-action="back"><span class="arrow">←</span> ${state.from==='album'?'アルバムに戻る':'今日に戻る'}</button><header class="reportHead"><div class="reportIdentity"><span>✳ 親だけに見せる、行動の気づき</span><span class="reportScope">家族新聞とは別</span></div><div class="reportDate">${safe(a.day)} · はるちゃんの記録</div><h1 class="reportTitle">${safe(a.title)}</h1><div class="badgeRow">${articleTag(a)}<span class="miniTag">架空の子ども・AI会話データ</span></div></header>${parentInsightReport(a)}<section class="reportResult"><h2>そのあと、どうなった？</h2><p>${safe(a.result)}</p><div class="resultRow"><span class="caption">${a.id==='s3'?(state.verified.activity?'40P 親の実施確認済み':'40P 達成確認待ち'):a.id==='s2'?'20P 親の実施確認済み（合成）':'0P 約束の記録'}</span>${articleTag(a)}</div></section>${pending?`<div class="section" style="margin-top:12px"><button class="button primary wide" data-action="request:activity">夕飯づくりの報告を確認する ›</button><p class="caption" style="text-align:center;margin:7px">記事を読んだだけではポイントは確定しません。</p></div>`:''}<section class="reportExpandable"><h2>もっと詳しく知りたいとき</h2><details class="details"><summary>どういう経緯で、そう考えた？</summary><div class="detailsContent">${a.modules.map(m=>moduleHtml(a,m)).join('')}<div class="timeline">${a.sequence.map(id=>{const e=evidence[id];return `<div class="timelineRow"><div class="dotline"></div><div class="timelineContent"><strong>${safe(e.type)}</strong><p>${safe(e.quote)}</p><div class="caption">${safe(e.time)} · ${safe(e.status)}</div></div></div>`}).join('')}</div></div></details><details class="details"><summary>本人の発言・記録をすべて見る</summary><div class="detailsContent"><p class="caption">本人が話したこと・家族から聞いた伝聞・AIが聞いた質問を分けて表示しています。</p><div class="evidenceList">${a.sequence.map(id=>evidenceCard(id)).join('')}</div></div></details>${newspaperExample(a)}</section><div class="section"><div class="sectionhead"><h2>過去の記録も読む</h2></div><div class="buttonrow" style="justify-content:space-between"><button class="button soft" data-action="adjacent:${a.id}:-1">← 前の記録</button><button class="button soft" data-action="adjacent:${a.id}:1">次の記録 →</button></div></div></div>`}
function evidenceCard(id){const e=evidence[id];return `<div class="evidence"><div class="type">${safe(e.type)} · ${safe(id)}</div><p>「${safe(e.quote)}」</p><div class="caption">${safe(e.time)}・${safe(e.status)}</div></div>`}
function demoPanel(){return `<details class="demoPanel" ${state.demoOpen?'open':''}><summary>デモの状態を切り替える（発表・確認用）</summary><p>サンプル上で表示を確認できます。実際の通知・ポイント・共有は発生しません。</p><div class="buttonrow"><button class="button" data-action="demo:reward">子からごほうび50Pの依頼</button><button class="button" data-action="demo:share">祖母への新聞共有依頼</button><button class="button" data-action="demo:reset">最初の状態に戻す</button></div><div class="caption" style="margin-top:9px">報酬交換と新聞公開は、クエストの達成確認とは別の承認です。</div></details>`}
function render(pos=0){tabs();el.innerHTML=state.page==='article'?story():state.tab==='today'?today():state.tab==='album'?album():family();el.scrollTop=pos}
function tab(t){if(!['today','album','family'].includes(t))return;state.tab=t;state.page='tab';render(state.scrollPositions[t]||0)}
function openArticle(id){if(!articles.some(a=>a.id===id))return;state.scrollPositions[state.tab]=el.scrollTop;state.from=state.tab;state.page='article';state.article=id;render(0)}
function back(){state.page='tab';render(state.scrollPositions[state.from]||0)}
function showDialog(type){if(!['activity','reward','share'].includes(type))return;let a=type==='activity'?articles[0]:articles[0];const text=type==='activity'?{title:'夕飯づくりの実施確認',subtitle:'本人が買い物と調理をしたと報告しています。',details:'事前合意：4人分の夕飯／予算1,000円／親と一緒に調理。確認した場合のみ40Pを確定するサンプルです。',check:'約束した範囲の実施を、保護者として確認しました',cta:'実施を確認する（デモ）'}:type==='share'?{title:'新聞への共有を確認',subtitle:'はるちゃんが、この記事をおばあちゃんに見せたいという架空の申請です。',details:'対象：10月8日の夕飯記事 v1／共有先：おばあちゃん／素材：本文のみ（写真なし）。',check:'本人の共有希望、記事の版、宛先を確認しました',cta:'この版の共有を確認（デモ）'}:{title:'ごほうび交換の確認',subtitle:'はるちゃんが「カフェに行きたい」と50Pの交換を申請した架空の例です。',details:`必要：50P／現在の残高：${state.points}P。交換は実際にカフェへ行ったことを意味しません。`,check:'交換の条件と提供方法を確認しました',cta:'50Pの交換を確認（デモ）'};
state.lastDialog=type;let enabled=state.pending[type];const canReward=type!=='reward'||state.points>=50;dialog.innerHTML=`<div class="dialogInside"><button class="close" type="button" data-dialog="close" aria-label="閉じる">✕</button><div class="eyebrow">保護者の確認 · 合成デモ</div><h2>${text.title}</h2><p class="sm">${text.subtitle}</p><div class="requireBox"><strong class="sm">確認する内容</strong><p>${text.details}</p></div>${type==='reward'&&!canReward?`<p class="sm" style="color:#9c6e2f">残高が足りないため交換を確認できません。先に実施確認の条件を満たす必要があります。</p>`:''}<label class="confirmSelect"><input id="confirmCheck" type="checkbox" ${!enabled||!canReward?'disabled':''}><span>${text.check}</span></label><div class="actionStack"><button class="button primary wide" data-dialog="approve" disabled>${text.cta}</button><button class="button wide" data-dialog="close">今は確認しない</button></div><p class="caption" style="margin-top:13px">実際の親への送信・認証・ポイント保存・新聞配信は行いません。</p></div>`;
dialog.showModal()}
function applyApproval(){const type=state.lastDialog;if(!state.pending[type])return;state.pending[type]=false;state.verified[type]=true;if(type==='activity')state.points+=40;if(type==='reward')state.points-=50;dialog.close();let labels={activity:'夕飯の実施確認（40P）',share:'新聞共有の確認',reward:'ごほうび交換（50P）'};notify(`${labels[type]}をデモ内で処理しました`);render(state.page==='article'?el.scrollTop:0)}
let toastTimeout;function notify(msg){const prior=document.querySelector('.toast');prior?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.append(d);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>d.remove(),2800)}
function act(v){const [cmd,a,b]=v.split(':');if(cmd==='tab')tab(a);if(cmd==='article')openArticle(a);if(cmd==='back')back();if(cmd==='filter'){state.albumFilter=a;render(0)}if(cmd==='request')showDialog(a);if(cmd==='prompt'){const keep=el.scrollTop;state.hiddenPrompts[a]=!state.hiddenPrompts[a];render(keep)}if(cmd==='adjacent'){let idx=articles.findIndex(z=>z.id===a),next=articles[(idx+Number(b)+articles.length)%articles.length];openArticle(next.id)}if(cmd==='evidence'){const ids=b.split(',');dialog.innerHTML=`<div class="dialogInside"><button class="close" data-dialog="close" aria-label="閉じる">✕</button><div class="eyebrow">編集文の元になった記録</div><h2>この部分の出所</h2><div class="evidenceList">${ids.filter(x=>evidence[x]).map(evidenceCard).join('')}</div><div class="actionStack"><button class="button wide" data-dialog="close">記事に戻る</button></div></div>`;dialog.showModal()}
if(cmd==='demo'){if(a==='reset'){state.pending={activity:true,share:false,reward:false};state.verified={activity:false,share:false,reward:false};state.points=20;state.hiddenPrompts={};state.genkiGrandma=true;state.stepsGrandma=5200;notify('最初の表示に戻しました')}if(a==='reward'){if(state.points<50){notify('今の例では残高不足。先に夕飯の確認が必要です')}else{state.pending.reward=true;notify('50Pの交換依頼を受信した例に切替')}}if(a==='share'){state.pending.share=true;notify('祖母への共有依頼を受信した例に切替')}render(el.scrollTop)}}
document.querySelector('.bottom').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)});
el.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action)});
el.addEventListener('toggle',e=>{if(e.target.matches('.demoPanel'))state.demoOpen=e.target.open},true);
