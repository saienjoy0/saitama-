<svg xmlns="http://www.w3.org/2000/svg" width="1298" height="1010" viewBox="0 0 1298 1010" role="img" aria-labelledby="title desc"><title id="title">祖父母の今日を、いつでも読める記録へ</title><desc id="desc">「元気だよ」だけでも、歩数や一言でも。家族の返事を待たずに使えます。。架空の例を使う実装前の画面設計図。</desc><rect width="100%" height="100%" fill="#EAF4F0"/><g font-family="system-ui,Noto Sans CJK JP,Noto Sans JP,sans-serif"><text x="32" y="48" font-size="30" font-weight="700" fill="#172B2A">祖父母の今日を、いつでも読める記録へ</text><text x="32" y="88" font-size="18" fill="#172B2A">「元気だよ」だけでも、歩数や一言でも。家族の返事を待たずに使えます。</text><rect x="32" y="156" width="390" height="698" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="48" y="132" font-size="18" font-weight="700" fill="#176B5B">UI09 · 祖父母</text><text x="48" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="332" y="191" font-size="20" font-weight="400" fill="#172B2A">たえ</text><path d="M32 210H422" stroke="#176B5B" fill="none"/><text x="52" y="251" font-size="26" font-weight="700" fill="#172B2A">今日を送る</text><rect x="48" y="274" width="358" height="120" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="64" y="318" font-size="20" font-weight="700" fill="#172B2A">10月7日・たえ</text><text x="64" y="362" font-size="20" font-weight="400" fill="#172B2A">送る言葉：元気だよ</text><rect x="48" y="410" width="358" height="120" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="64" y="454" font-size="20" font-weight="700" fill="#172B2A">送る相手</text><text x="64" y="498" font-size="20" font-weight="400" fill="#172B2A">ゆり（娘）</text><rect x="48" y="546" width="358" height="56" rx="12" fill="#FFFFFF" stroke="#176B5B"/><text x="64" y="582" font-size="20" font-weight="400" fill="#176B5B">歩数や一言を付ける</text><rect x="48" y="618" width="358" height="56" rx="12" fill="#176B5B"/><text x="64" y="654" font-size="20" font-weight="700" fill="#FFFFFF">『元気だよ』を送る</text><text x="64" y="710" font-size="20" font-weight="400" fill="#176B5B">自分の記録にだけ残す</text><path d="M32 754H422" stroke="#176B5B" fill="none"/><text x="44" 