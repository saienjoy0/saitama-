>これまで</text><rect x="876" y="156" width="390" height="682" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="892" y="132" font-size="18" font-weight="700" fill="#176B5B">UI11 · 祖父母</text><text x="892" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="1176" y="191" font-size="20" font-weight="400" fill="#172B2A">たえ</text><path d="M876 210H1266" stroke="#176B5B" fill="none"/><text x="896" y="251" font-size="26" font-weight="700" fill="#172B2A">これまで</text><rect x="892" y="274" width="358" height="184" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="908" y="318" font-size="20" font-weight="700" fill="#172B2A">2026年10月</text><text x="908" y="362" font-size="20" font-weight="400" fill="#172B2A">10月7日　みなと・今日の買い物</text><text x="908" y="394" font-size="20" font-weight="400" fill="#172B2A">10月5日　たえ・公園まで歩いてき</text><text x="908" y="426" font-size="20" font-weight="400" fill="#172B2A">た</text><rect x="892" y="474" width="358" height="184" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="908" y="518" font-size="20" font-weight="700" fill="#172B2A">何度でも読み返せる</text><text x="908" y="562" font-size="20" font-weight="400" fill="#172B2A">新聞で読んだ同じ出来事です。</text><text x="908" y="594" font-size="20" font-weight="400" fill="#172B2A">日付・本人の言葉・家族の言葉を</text><text x="908" y="626" font-size="20" font-weight="400" fill="#172B2A">分けて残します。</text><text x="908" y="694" font-size="20" font-weight="400" fill="#176B5B">今日に戻る</text><path d="M876 738H1266" stroke="#176B5B" fill="none"/><text x="888" y="766" font-size="20" font-weight="400" fill="#176B5B">家族の新聞</text><text x="1018" y="766" font-size="20" font-weight="400" fill="#176B5B">今日を送る</text><text x="1148" y="766" font-size="20" font-weight="700" fill="#176B5B">これまで</text><text x="32" y="972" font-size="16" fill="#172B2A">架空の例・設計図。保存・共有・受取は別の状態です。製品実装と利用者検証は未実施。</text></g></svg>
