<svg xmlns="http://www.w3.org/2000/svg" width="1298" height="1272.8" viewBox="0 0 1298 1272.8" role="img" aria-labelledby="title desc"><title id="title">お金・ポイント・任せ方を分ける</title><desc id="desc">残高、交換、次の条件。約束したお金は、受け取ってから使えるお金になります。。架空の例を使う実装前の画面設計図。</desc><rect width="100%" height="100%" fill="#EAF4F0"/><g font-family="system-ui,Noto Sans CJK JP,Noto Sans JP,sans-serif"><text x="32" y="48" font-size="30" font-weight="700" fill="#172B2A">お金・ポイント・任せ方を分ける</text><text x="32" y="88" font-size="18" fill="#172B2A">残高、交換、次の条件。約束したお金は、受け取ってから使えるお金になります。</text><rect x="32" y="156" width="390" height="1024.7999999999997" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="48" y="132" font-size="18" font-weight="700" fill="#176B5B">UI04 · 子ども</text><text x="48" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="332" y="191" font-size="16" font-weight="400" fill="#172B2A">みなと</text><path d="M32 210H422" stroke="#176B5B" fill="none"/><text x="52" y="251" font-size="26" font-weight="700" fill="#172B2A">お金とごほうび</text><rect x="48" y="274" width="358" height="142.4" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="64" y="316" font-size="18" font-weight="700" fill="#172B2A">いま持っているお金</text><text x="64" y="356.8" font-size="18" font-weight="400" fill="#172B2A">500円</text><text x="64" y="385.6" font-size="18" font-weight="400" fill="#172B2A">受取 1,000円 − 使った 500円</text><rect x="48" y="432.4" width="358" height="171.2" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="64" y="474.4" font-size="18" font-weight="700" fill="#172B2A">家族ポイント</text><text x="64" y="515.2" font-size="18" font-weight="400" fill="#172B2A">120 P</text><text x="64" y="544" font-size="18" font-weight="400" fill="#172B2A">お金とは別に、家族の特典と交換でき</text><text x="64" y="572.8" font-size="18" font-weight="400" fill="#172B2A">ます。</text><rect x="48" y="619.5999999999999" width="358" height="142.4" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="64" y="661.5999999999999" font-size="18" font-weight="700" fill="#172B2A">貯めると増える約束</text><text x="64" y="702.3999999999999" font-size="18" font-weight="400" fill="#172B2A">11月の例：500円 × 月5% = 25円</text><text x="64" y="731.1999999999998" font-size="18" font-weight="400" fill="#172B2A">親が支払う・上限50円・未受取</text><rect x="48" y="777.9999999999999" width="358" height="171.2" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="64" y="819.9999999999999" font-size="18" font-weight="700" fill="#172B2A">金融の練習</text><text x="64" y="860.7999999999998" font-size="18" font-weight="400" fill="#172B2A">10,000 練習円</text><text x="64" y="889.5999999999998" font-size="18" font-weight="400" fill="#172B2A">銀行・借りる・投資を練習用のお金で</text><text x="64" y="918.3999999999997" font-size="18" font-weight="400" fill="#172B2A">試す</text><rect x="48" y="965.1999999999998" width="358" height="52.8" rx="12" fill="#176B5B"/><text x="64" y="999.1999999999998" font-size="18" font-weight="700" fill="#FFFFFF">お金の出入りを残す</text><text x="64" y="1051.9999999999998" font-size="18" font-weight="400" fill="#176B5B">今は残さない</text><path d="M32 1094.7999999999997H422" stroke="#176B5B" fill="none"/><text x="44" y="1122.7999999999997" font-size="16" font-weight="400" fill="#176B5B">今回の</text><text x="44" y="1147.7999999999997" font-size="16" font-weight="400" fill="#176B5B">やってみ</text><text x="174" y="1122.7999999999997" font-size="16" font-weight="400" fill="#176B5B">これまで</text><text x="304" y="1122.7999999999997" font-size="16" font-weight="700" fill="#176B5B">お金と</text><text x="304" y="1147.7999999999997" font-size="16" font-weight="700" fill="#176B5B">ごほうび</text><rect x="454" y="156" width="390" height="866.3999999999999" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="470" y="132" font-size="18" font-weight="700" fill="#176B5B">UI05 · 子ども</text><text x="470" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="754" y="191" font-size="16" font-weight="400" fill="#172B2A">みなと</text><path d="M454 210H844" stroke="#176B5B" fill="none"/><text x="474" y="251" font-size="26" font-weight="700" fill="#172B2A">家族のごほうび</text><rect x="470" y="274" width="358" height="142.4" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="486" y="316" font-size="18" font-weight="700" fill="#172B2A">家族で映画に行く</text><text x="486" y="356.8" font-size="18" font-weight="400" fill="#172B2A">100 P・日程は家族で相談</text><text x="486" y="385.6" font-size="18" font-weight="400" fill="#172B2A">使えるポイント：120 P</text><rect x="470" y="432.4" width="358" height="171.2" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="486" y="474.4" font-size="18" font-weight="700" fill="#172B2A">ほかにも選べる</text><text x="486" y="515.2" font-size="18" font-weight="400" fill="#172B2A">追加のお小遣い・プレゼント・お出か</text><text x="486" y="544" font-size="18" font-weight="400" fill="#172B2A">け</text><text x="486" y="572.8" font-size="18" font-weight="400" fill="#172B2A">この家族が決めた特典です。</text><rect x="470" y="619.5999999999999" width="358" height="171.2" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="486" y="661.5999999999999" font-size="18" font-weight="700" fill="#172B2A">受け取るまで</text><text x="486" y="702.3999999999999" font-size="18" font-weight="400" fill="#172B2A">申請 → 親の確認 → 受取</text><text x="486" y="731.1999999999998" font-size="18" font-weight="400" fill="#172B2A">承認されたことと、受け取ったことは</text><text x="486" y="759.9999999999998" font-size="18" font-weight="400" fill="#172B2A">別です。</text><rect x="470" y="806.8" width="358" height="52.8" rx="12" fill="#176B5B"/><text x="486" y="840.8" font-size="18" font-weight="700" fill="#FFFFFF">このごほうびをお願いする</text><text x="486" y="893.5999999999999" font-size="18" font-weight="400" fill="#176B5B">別のごほうびを見る</text><path d="M454 936.3999999999999H844" stroke="#176B5B" fill="none"/><text x="466" y="964.3999999999999" font-size="16" font-weight="400" fill="#176B5B">今回の</text><text x="466" y="989.3999999999999" font-size="16" font-weight="400" fill="#176B5B">やってみ</text><text x="596" y="964.3999999999999" font-size="16" font-weight="400" fill="#176B5B">これまで</text><text x="726" y="964.3999999999999" font-size="16" font-weight="700" fill="#176B5B">お金と</text><text x="726" y="989.3999999999999" font-size="16" font-weight="700" fill="#176B5B">ごほうび</text><rect x="876" y="156" width="390" height="1024.8" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="892" y="132" font-size="18" font-weight="700" fill="#176B5B">UI07 · 親</text><text x="892" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="1176" y="191" font-size="16" font-weight="400" fill="#172B2A">ゆり</text><path d="M876 210H1266" stroke="#176B5B" fill="none"/><text x="896" y="251" font-size="26" font-weight="700" fill="#172B2A">次のお小遣いの提案</text><rect x="892" y="274" width="358" height="142.4" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="908" y="316" font-size="18" font-weight="700" fill="#172B2A">変えること</text><text x="908" y="356.8" font-size="18" font-weight="400" fill="#172B2A">週払い 500円 → 月払い 2,000円</text><text x="908" y="385.6" font-size="18" font-weight="400" fill="#172B2A">2026年11月1日〜30日だけ試す</text><rect x="892" y="432.4" width="358" height="142.4" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="908" y="474.4" font-size="18" font-weight="700" fill="#172B2A">見た記録・4週間の例</text><text x="908" y="515.2" font-size="18" font-weight="400" fill="#172B2A">予算を超えた記録なし・価格比較3回</text><text x="908" y="544" font-size="18" font-weight="400" fill="#172B2A">貯金目標を達成・本人が月払いを希望</text><rect x="892" y="590.8" width="358" height="200" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="908" y="632.8" font-size="18" font-weight="700" fill="#172B2A">まだ分からないこと</text><text x="908" y="673.5999999999999" font-size="18" font-weight="400" fill="#172B2A">月全体にお金を配分する経験は</text><text x="908" y="702.3999999999999" font-size="18" font-weight="400" fill="#172B2A">未確認。</text><text x="908" y="731.1999999999998" font-size="18" font-weight="400" fill="#172B2A">使う用途は今のまま。12月前に見直し</text><text x="908" y="759.9999999999998" font-size="18" font-weight="400" fill="#172B2A">ます。</text><rect x="892" y="806.8" width="358" height="142.4" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="908" y="848.8" font-size="18" font-weight="700" fill="#172B2A">受取の予定</text><text x="908" y="889.5999999999999" font-size="18" font-weight="400" fill="#172B2A">11月1日に2,000円を渡す予定。</text><text x="908" y="918.3999999999999" font-size="18" font-weight="400" fill="#172B2A">受け取ってから、残高に反映します。</text><rect x="892" y="965.1999999999999" width="358" height="52.8" rx="12" fill="#176B5B"/><text x="908" y="999.1999999999999" font-size="18" font-weight="700" fill="#FFFFFF">この条件を1か月試す</text><text x="908" y="1052" font-size="18" font-weight="400" fill="#176B5B">今のままにする</text><path d="M876 1094.8H1266" stroke="#176B5B" fill="none"/><text x="888" y="1122.8" font-size="16" font-weight="700" fill="#176B5B">確認</text><text x="1018" y="1122.8" font-size="16" font-weight="400" fill="#176B5B">家族の記録</text><text x="1148" y="1122.8" font-size="16" font-weight="400" fill="#176B5B">設定</text><text x="32" y="1234.8" font-size="16" fill="#172B2A">架空の例・設計図。保存・共有・受取は別の状態です。製品実装と利用者検証は未実施。</text></g></svg>
