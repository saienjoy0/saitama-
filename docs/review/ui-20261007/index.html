<script>
const data=JSON.parse(document.getElementById('screen-model').textContent);
const ui=JSON.parse(document.getElementById('ui-tokens').textContent);
const product=document.getElementById('product');
const roleSelect=document.getElementById('role-select');
const screenSelect=document.getElementById('screen-select');
const scenarioSelect=document.getElementById('scenario-select');
const scaleSelect=document.getElementById('scale-select');
const reviewStatus=document.getElementById('review-status');
const session={role:'child',screen:'UI01',scenario:'normal',original:data.sample.original,share:false,whole:false,record:'draft',shareState:'not_requested',transaction:false,changed:false,inflight:false,adultRecord:'draft',adultShare:'not_requested',reward:'none',notice:'',choice:'buy',todayNote:'公園まで歩いてきた。',steps:'5200',reply:''};
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,kind='secondary',disabled=false)=>'<button type="button" class="'+kind+'" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+escape(label)+'</button>';
const panel=(heading,body,extra='')=>'<section class="panel '+extra+'"><h3>'+escape(heading)+'</h3>'+body+'</section>';
const paragraphs=lines=>lines.map(s=>'<p>'+escape(s)+'</p>').join('');
const quote=text=>'<blockquote>'+escape(text)+'</blockquote>';
const selectedText=()=>session.whole?session.original:(session.original.match(/^[\s\S]*?。[\s\S]*?。/)?.[0]||session.original);
const knownArticle=()=>!session.transaction||session.shareState==='published';
function defaultRoleScreen(role){return role==='child'?'UI01':role==='parent'?'UI06':'UI08';}
function availableScreens(role){return data.screens.filter(s=>s.role===role||s.type==='album');}
function chooseScreen(id,focus=false){session.screen=id;screenSelect.value=id;render();if(focus)document.getElementById('screen-title').focus();}
function status(record,share){return '<div class="status" aria-label="記録と共有の状態"><span class="pill">記録：'+escape(ui.labels[record]||record)+'</span><span class="pill">共有：'+escape(ui.labels[share]||share)+'</span></div>';}
function navigation(screen){
 const tabs=ui.roles[session.role].tabs;
 const target=session.role==='child'?['UI01','UI11','UI04']:session.role==='parent'?['UI06','UI11','settings']:['UI08','UI09','UI11'];
 let active=screen.type==='album'?1:session.role==='child'&&['money','rewards'].includes(screen.type)?2:session.role==='grandparent'&&['quickpost','post'].includes(screen.type)?1:session.role==='grandparent'&&screen.type==='album'?2:0;
 if(session.role==='grandparent'&&screen.type==='album')active=2;
 return '<nav class="product-nav" aria-label="主な画面">'+tabs.map((t,i)=>'<button type="button" data-target="'+target[i]+'"'+(i===active?' aria-current="page"':'')+'>'+escape(t)+'</button>').join('')+'</nav>';
}
function render(){
 const screen=data.screens.find(s=>s.id===session.screen);
 const role=session.role;
 product.dataset.role=role;
 product.classList.toggle('large-text',scaleSelect.value==='2');
 product.classList.toggle('reduced',session.scenario==='reduced');
 product.style.setProperty('--scale',scaleSelect.value);
 const person=role==='child'?data.sample.child:role==='parent'?data.sample.parent:data.sample.grandparent;
 let content='',primary='',alternative='';
 switch(screen.type){
 case 'conditions':
  content=panel('今回の条件',paragraphs(screen.sections[0].lines),'soft')+panel('自分で選べること',paragraphs(screen.sections[1].lines))+button('条件を変える','conditions-help','quiet');
  primary=button(screen.primary,'start','primary');alternative=button(screen.alternative,'later','quiet');break;
 case 'choice':
  content=panel('今回の用事',paragraphs(screen.sections[0].lines),'soft')+
   '<fieldset class="choices"><legend>選択肢</legend>'+[['buy','今買う'],['wait','来週にする'],['compare','別の商品やお店を見る']].map(([value,label])=>'<label class="check"><input type="radio" name="choice" value="'+value+'"'+(session.choice===value?' checked':'')+'><span>'+label+'</span></label>').join('')+'</fieldset>'+
   '<details><summary>比べるときの助け</summary><p>量、使う日、家にあるものを見てみよう。迷ったら、親と相談できます。</p></details>';
  primary=button(screen.primary,'record','primary');alternative=button(screen.alternative,'later','quiet');break;
 case 'record':
  content=panel('今回の用事',paragraphs(['夕飯の材料・3人分・予算1,000円']),'soft')+
    '<label for="original">話したこと・直して残せます</label><textarea id="original" rows="5">'+escape(session.original)+'</textarea>'+
    button('話して残す','voice-note','quiet')+
    '<p>この記録を見る人：自分と、管理する親</p>'+
    '<label class="check"><input id="share-choice" type="checkbox"'+(session.share?' checked':'')+'><span>家族にも見せたい</span></label>';
  if(session.share){
    content+='<fieldset class="choices"><legend>見せる文章を選ぶ</legend>'+
      '<label class="check"><input type="radio" name="excerpt" value="excerpt"'+(!session.whole?' checked':'')+'><span>原文の前の2文</span></label>'+
      '<label class="check"><input type="radio" name="excerpt" value="whole"'+(session.whole?' checked':'')+'><span>原文全部（金額も含みます）</span></label></fieldset>'+
      panel('送る文章',quote(selectedText()))+panel('送る相手',paragraphs(['たえ（おばあちゃん）','今は相手には届きません。']));
  }
  content+=status(session.record,session.shareState);
  if(session.record==='save_failed')content+='<p class="error" role="alert">保存できませんでした。入力はこのまま残っています。</p>';
  const label=session.inflight?'保存中…':session.record==='save_failed'?'もう一度保存する':session.share?'保存して親に確認を頼む':'この内容で残す';
  primary=session.record==='saved'?'':button(label,'save','primary',session.inflight);
  if(session.record==='saved')content+='<p>ここで終われます。家族の返事を待つ必要はありません。</p>';
  alternative=button('あとで','later','quiet');break;
 case 'review':
  if(session.scenario==='empty'||session.scenario==='private'||(session.transaction&&session.shareState==='not_requested')){
    content=panel('確認はありません',paragraphs(['家族の記録はいつでも見られます。']));alternative=button('家族の記録を見る','album','secondary');break;
  }
  if(!session.transaction){session.shareState='pending_review';session.record='saved';}
  content=panel('みなとが選んだ文章',quote(selectedText()))+
    panel('送る相手',paragraphs([session.changed?'内容や相手を変更しました。':'たえ（おばあちゃん）']),'soft')+
    '<p>共有するもの：本人が選んだ文章のみ・写真なし</p>'+
    '<details><summary>本人の記録を見る</summary>'+quote(session.original)+'<p>予算1,000円・使用額860円。この欄は新聞に含みません。</p></details>'+
    status(session.record,session.shareState);
  if(session.changed)content+='<p class="error">子どもが見せる内容と相手を、もう一度選ぶ必要があります。</p>';
  if(session.shareState==='send_failed')content+='<p class="error" role="alert">送れませんでした。内容を保って、もう一度送れます。</p>';
  if(session.shareState==='published'){content+='<p>たえに共有済みです。読んだかどうかはまだ分かりません。</p>';alternative=button('共有を取り消す','revoke','secondary');}
  else if(session.changed){primary=button('子どもに選び直してもらう','reselect','primary');alternative=button('後で確認する','later','quiet');}
  else {primary=button(session.inflight?'送信中…':screen.primary,'publish','primary',session.inflight);alternative=button('内容や相手を変える','change','secondary')+button(screen.alternative,'decline','quiet')+button('後で確認する','later','quiet');}
  break;
 case 'proposal':
  content=screen.sections.map(s=>panel(s.heading,paragraphs(s.lines),s.heading==='変えること'?'soft':'')).join('');
  primary=button(screen.primary,'proposal','primary');alternative=button('条件を変えて相談する','proposal-change','secondary')+button(screen.alternative,'proposal-decline','quiet');break;
 case 'newspaper':
  if(session.scenario==='empty'||session.scenario==='pending'||session.scenario==='private'||!knownArticle()){
   content=panel('今日は新しい記事がありません',paragraphs(['これまでの出来事は、いつでも読めます。']));
  }else{
   content='<article class="panel"><p>10月7日・みなと</p><h3>今日の買い物</h3>'+quote(selectedText())+'</article>'+
     button('読んだよ','read','secondary')+
     '<details><summary>経験や質問を返す</summary><label for="reply">伝えたいこと</label><textarea id="reply" rows="3">'+escape(session.reply)+'</textarea>'+button('返事を送る','reply','secondary')+'</details>';
  }
  alternative=button(screen.alternative,'later','quiet');break;
 case 'quickpost':
 case 'post':
  content=panel('10月7日・たえ',screen.type==='quickpost'?paragraphs(['送る言葉：元気だよ']):'<label for="today-note">今日の一言</label><textarea id="today-note" rows="3">'+escape(session.todayNote)+'</textarea><label for="steps">今日の歩数（手入力）</label><input id="steps" type="number" min="0" step="1" value="'+escape(session.steps)+'">')+
   panel('送る相手',paragraphs(['ゆり（娘）']),'soft');
  if(screen.type==='quickpost')content+=button('歩数や一言を付ける','post-detail','secondary');
  else content+='<p>歩数の取得元：手入力。残したいものだけ送れます。</p>';
  content+=status(session.adultRecord,session.adultShare);
  if(session.adultShare==='send_failed')content+='<p class="error" role="alert">送れませんでした。入力はこのまま残っています。</p>';
  if(session.adultShare==='published')content+='<p>ゆりに共有済みです。読んだかどうかはまだ分かりません。</p>';
  else primary=button(session.inflight?'送信中…':screen.primary,'adult-send','primary',session.inflight);
  alternative=button(screen.alternative,'adult-save','quiet')+button('あとで','later','quiet');break;
 case 'album':
  content=panel('2026年10月',button('10月7日　みなと・今日の買い物','open-record','secondary')+button('10月5日　たえ・公園まで歩いてきた','open-adult','secondary'));
  if(role==='grandparent'&&!knownArticle())content=panel('2026年10月',button('10月5日　たえ・公園まで歩いてきた','open-adult','secondary'));
  content+='<p>新聞と同じ、見せてよい出来事を読み返せます。</p>';alternative=button('今日に戻る','today','quiet');break;
 case 'money':
  content=panel('いま持っているお金','<p class="amount">500<span class="unit"> 円</span></p><p>受取1,000円 − 使った500円</p>','soft')+
   panel('家族ポイント','<p class="amount">'+(session.reward==='none'?'120':'20')+'<span class="unit"> P</span></p>'+paragraphs([session.reward==='none'?'お金とは別のポイントです。':'100 Pはごほうびの申請に予約中。'])+button('家族のごほうびを見る','rewards','secondary'))+
   '<details><summary>11月の貯金ボーナスの約束</summary><p>500円を1か月残すと、月5%で25円。</p><p>ゆりが支払う・対象元本の上限1,000円・支払上限50円。まだ受け取っていません。</p></details>'+
   '<details><summary>金融の練習</summary><p>10,000 練習円</p><p>銀行・借りる・銘柄の値動きを、練習用のお金で比べます。</p></details>';
  primary=button(screen.primary,'money-drawing','primary');alternative=button('今は残さない','later','quiet');break;
 case 'rewards':
  content=panel('家族で映画に行く',paragraphs(['100 P・日程は家族で相談','使えるポイント：'+(session.reward==='none'?'120':'20')+' P']),'soft')+
    panel('家庭で決めた特典',paragraphs(['追加のお小遣い・プレゼント・お出かけ等を、家族が用意します。']));
  if(session.reward==='none')primary=button(screen.primary,'request-reward','primary');
  else content+=panel('申請中',paragraphs(['100 Pを予約しました。親の確認待ちです。','承認されたことと、受け取ったことは別です。']));
  alternative=button('お金とごほうびに戻る','money','quiet');break;
 case 'empty':
  content=screen.sections.map(s=>panel(s.heading,paragraphs(s.lines))).join('');alternative=button('これまでを読む','album','secondary');break;
 }
 product.innerHTML='<header class="product-header"><span class="brand">やってみクエスト</span><span class="person">'+escape(person)+'</span></header><div class="content"><h2 id="screen-title" tabindex="-1">'+escape(screen.title)+'</h2>'+content+'<div id="product-feedback" role="status" aria-live="polite">'+escape(session.notice)+'</div>'+primary+alternative+'</div>'+navigation(screen);
 reviewStatus.textContent=screen.id+' · '+screen.refs.features.join(' / ')+' · '+({normal:'通常',save_fail:'保存失敗',send_fail:'送信失敗',empty:'空',pending:'親の確認待ち',private:'共有しない',reduced:'動きを減らす'}[session.scenario])+'の見本';
}
function setRole(role){session.role=role;roleSelect.value=role;screenSelect.innerHTML=availableScreens(role).map(s=>'<option value="'+s.id+'">'+s.id+' '+escape(s.title)+'</option>').join('');chooseScreen(defaultRoleScreen(role));}
roleSelect.addEventListener('change',()=>setRole(roleSelect.value));
screenSelect.addEventListener('change',()=>chooseScreen(screenSelect.value,true));
scenarioSelect.addEventListener('change',()=>{session.scenario=scenarioSelect.value;session.notice='';render();});
scaleSelect.addEventListener('change',render);
product.addEventListener('input',event=>{
 if(event.target.id==='today-note')session.todayNote=event.target.value;
 if(event.target.id==='steps')session.steps=event.target.value;
 if(event.target.id==='reply')session.reply=event.target.value;
 if(event.target.id==='original'){session.original=event.target.value;session.record='draft';session.shareState='not_requested';session.share=false;session.whole=true;session.transaction=true;}
});
product.addEventListener('change',event=>{
 if(event.target.id==='share-choice'){session.share=event.target.checked;session.record='draft';session.shareState='not_requested';render();}
 if(event.target.name==='excerpt'){session.whole=event.target.value==='whole';session.record='draft';session.shareState='not_requested';render();}
 if(event.target.name==='choice')session.choice=event.target.value;
});
product.addEventListener('click',async event=>{
 const target=event.target.closest('button');if(!target||target.disabled)return;
 if(target.dataset.target){if(target.dataset.target==='settings'){reviewStatus.textContent='設定の内容はS01計画のレビュー対象です。今回は配置のみの見本です。';return;}session.notice='';chooseScreen(target.dataset.target,true);return;}
 const action=target.dataset.action;
 if(action==='start')return chooseScreen('UI02',true);
 if(action==='record'){session.original='';session.whole=true;session.share=false;session.record='draft';session.shareState='not_requested';return chooseScreen('UI03',true);}
 if(action==='album')return chooseScreen('UI11',true);
 if(action==='post-detail')return chooseScreen('UI10',true);
 if(action==='today')return chooseScreen(defaultRoleScreen(session.role),true);
 if(action==='rewards')return chooseScreen('UI05',true);
 if(action==='money')return chooseScreen('UI04',true);
 if(action==='open-record')return chooseScreen(session.role==='child'?'UI03':session.role==='parent'?'UI06':'UI08',true);
 if(action==='open-adult'){session.notice='10月5日・たえの記録：公園まで歩いてきた。歩数5,200歩（手入力）。';return render();}
 if(action==='change'){session.transaction=true;session.changed=true;session.shareState='pending_review';return render();}
 if(action==='reselect'){session.share=false;session.changed=false;session.record='draft';session.shareState='not_requested';setRole('child');chooseScreen('UI03',true);return;}
 if(action==='decline'||action==='revoke'){session.transaction=true;session.shareState=action==='revoke'?'revoked':'not_requested';session.notice=action==='revoke'?'共有を取り消しました。':'今回は送らないことにしました。';return render();}
 if(action==='request-reward'){session.reward='requested';return render();}
 if(action==='save'||action==='publish'||action==='adult-send'){
  if(session.inflight)return;
  const todayNote=document.getElementById('today-note')?.value;const stepValue=document.getElementById('steps')?.value;
  session.inflight=true;session.notice='';if(action==='save'){session.transaction=true;session.record='saving';}
  if(action==='publish')session.transaction=true;
  render();
  await new Promise(resolve=>setTimeout(resolve,120));
  session.inflight=false;
  if(action==='save'){session.record=session.scenario==='save_fail'?'save_failed':'saved';session.shareState=session.record==='saved'&&session.share?'pending_review':'not_requested';}
  if(action==='publish')session.shareState=session.scenario==='send_fail'?'send_failed':'published';
  if(action==='adult-send'){session.adultRecord='saved';session.adultShare=session.scenario==='send_fail'?'send_failed':'published';}
  render();
  if(todayNote!==undefined&&document.getElementById('today-note'))document.getElementById('today-note').value=todayNote;
  if(stepValue!==undefined&&document.getElementById('steps'))document.getElementById('steps').value=stepValue;
  return;
 }
 if(action==='adult-save'){session.adultRecord='saved';session.adultShare='not_requested';session.notice='自分の記録に残しました。家族には送っていません。';return render();}
 if(action==='read'){session.notice='「読んだよ」を伝えました。';return render();}
 if(action==='reply'){session.notice='返事を伝えました。';return render();}
 if(action==='proposal'){session.notice='11月の条件を試す予定です。お金はまだ受け取っていません。';return render();}
 if(action==='proposal-change'||action==='proposal-decline'){session.notice='今の条件を保ち、親子で相談できます。';return render();}
 if(action==='later'){session.notice='ここで終われます。';return render();}
 if(['voice-note','conditions-help','money-drawing'].includes(action)){reviewStatus.textContent='この操作の先は今回の画面図の範囲です。保存・送信・金額変更は実行しません。';return;}
});
setRole('child');
</script></body></html>
