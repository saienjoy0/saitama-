<svg xmlns="http://www.w3.org/2000/svg" width="1298" height="1143.1999999999998" viewBox="0 0 1298 1143.1999999999998" role="img" aria-labelledby="title desc"><title id="title">記録から、親の確認、家族の新聞へ</title><desc id="desc">共有を選んだ一件の例。本人の選んだ文章を、同じ内容で届けます。。架空の例を使う実装前の画面設計図。</desc><rect width="100%" height="100%" fill="#EAF4F0"/><g font-family="system-ui,Noto Sans CJK JP,Noto Sans JP,sans-serif"><text x="32" y="48" font-size="30" font-weight="700" fill="#172B2A">記録から、親の確認、家族の新聞へ</text><text x="32" y="88" font-size="18" fill="#172B2A">共有を選んだ一件の例。本人の選んだ文章を、同じ内容で届けます。</text><rect x="32" y="156" width="390" height="895.1999999999998" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="48" y="132" font-size="18" font-weight="700" fill="#176B5B">UI03 · 子ども</text><text x="48" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="332" y="191" font-size="16" font-weight="400" fill="#172B2A">みなと</text><path d="M32 210H422" stroke="#176B5B" fill="none"/><text x="52" y="251" font-size="26" font-weight="700" fill="#172B2A">今日の買い物</text><rect x="48" y="274" width="358" height="171.2" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="64" y="316" font-size="18" font-weight="700" fill="#172B2A">話したこと</text><text x="64" y="356.8" font-size="18" font-weight="400" fill="#172B2A">肉は少ない方にした。今日は使う分だ</text><text x="64" y="385.6" font-size="18" font-weight="400" fill="#172B2A">けでよかったから。全部で860円だっ</text><text x="64" y="414.40000000000003" font-size="18" font-weight="400" fill="#172B2A">た。</text><rect x="48" y="461.2" width="358" height="113.6" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="64" y="503.2" font-size="18" font-weight="700" fill="#172B2A">この記録を見る人</text><text x="64" y="544" font-size="18" font-weight="400" fill="#172B2A">自分と、管理する親</text><rect x="48" y="590.8" width="358" height="228.8" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="64" y="632.8" font-size="18" font-weight="700" fill="#172B2A">家族にも見せたい：選択</text><text x="64" y="673.5999999999999" font-size="18" font-weight="400" fill="#172B2A">見せる部分：原文の前の2文</text><text x="64" y="702.3999999999999" font-size="18" font-weight="400" fill="#172B2A">肉は少ない方にした。今日は使う分だ</text><text x="64" y="731.1999999999998" font-size="18" font-weight="400" fill="#172B2A">けでよかったから。</text><text x="64" y="759.9999999999998" font-size="18" font-weight="400" fill="#172B2A">相手：たえ（おばあちゃん）</text><text x="64" y="788.7999999999997" font-size="18" font-weight="400" fill="#172B2A">今は相手には届きません。</text><rect x="48" y="835.5999999999999" width="358" height="52.8" rx="12" fill="#176B5B"/><text x="64" y="869.5999999999999" font-size="18" font-weight="700" fill="#FFFFFF">保存して親に確認を頼む</text><text x="64" y="922.3999999999999" font-size="18" font-weight="400" fill="#176B5B">あとで</text><path d="M32 965.1999999999998H422" stroke="#176B5B" fill="none"/><text x="44" y="993.1999999999998" font-size="16" font-weight="700" fill="#176B5B">今回の</text><text x="44" y="1018.1999999999998" font-size="16" font-weight="700" fill="#176B5B">やってみ</text><text x="174" y="993.1999999999998" font-size="16" font-weight="400" fill="#176B5B">これまで</text><text x="304" y="993.1999999999998" font-size="16" font-weight="400" fill="#176B5B">お金と</text><text x="304" y="1018.1999999999998" font-size="16" font-weight="400" fill="#176B5B">ごほうび</text><rect x="454" y="156" width="390" height="779.9999999999999" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="470" y="132" font-size="18" font-weight="700" fill="#176B5B">UI06 · 親</text><text x="470" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="754" y="191" font-size="16" font-weight="400" fill="#172B2A">ゆり</text><path d="M454 210H844" stroke="#176B5B" fill="none"/><text x="474" y="251" font-size="26" font-weight="700" fill="#172B2A">家族に送る内容の確認</text><rect x="470" y="274" width="358" height="142.4" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="486" y="316" font-size="18" font-weight="700" fill="#172B2A">みなとが選んだ文章</text><text x="486" y="356.8" font-size="18" font-weight="400" fill="#172B2A">肉は少ない方にした。今日は使う分だ</text><text x="486" y="385.6" font-size="18" font-weight="400" fill="#172B2A">けでよかったから。</text><rect x="470" y="432.4" width="358" height="113.6" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="486" y="474.4" font-size="18" font-weight="700" fill="#172B2A">送る相手</text><text x="486" y="515.2" font-size="18" font-weight="400" fill="#172B2A">たえ（おばあちゃん）</text><rect x="470" y="562" width="358" height="142.4" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="486" y="604" font-size="18" font-weight="700" fill="#172B2A">送るもの</text><text x="486" y="644.8" font-size="18" font-weight="400" fill="#172B2A">選んだ文章のみ・写真なし</text><text x="486" y="673.5999999999999" font-size="18" font-weight="400" fill="#172B2A">記録：保存済み／共有：親の確認待ち</text><rect x="470" y="720.4" width="358" height="52.8" rx="12" fill="#176B5B"/><text x="486" y="754.4" font-size="18" font-weight="700" fill="#FFFFFF">この内容を送る</text><text x="486" y="807.1999999999999" font-size="18" font-weight="400" fill="#176B5B">今回は送らない</text><path d="M454 849.9999999999999H844" stroke="#176B5B" fill="none"/><text x="466" y="877.9999999999999" font-size="16" font-weight="700" fill="#176B5B">確認</text><text x="596" y="877.9999999999999" font-size="16" font-weight="400" fill="#176B5B">家族の記録</text><text x="726" y="877.9999999999999" font-size="16" font-weight="400" fill="#176B5B">設定</text><rect x="876" y="156" width="390" height="810" rx="16" fill="#FFFDF7" stroke="#176B5B"/><text x="892" y="132" font-size="18" font-weight="700" fill="#176B5B">UI08 · 祖父母</text><text x="892" y="191" font-size="18" font-weight="700" fill="#176B5B">やってみクエスト</text><text x="1176" y="191" font-size="20" font-weight="400" fill="#172B2A">たえ</text><path d="M876 210H1266" stroke="#176B5B" fill="none"/><text x="896" y="251" font-size="26" font-weight="700" fill="#172B2A">家族の新聞</text><rect x="892" y="274" width="358" height="120" rx="16" fill="#EAF4F0" stroke="#EAF4F0"/><text x="908" y="318" font-size="20" font-weight="700" fill="#172B2A">10月7日・みなと</text><text x="908" y="362" font-size="20" font-weight="400" fill="#172B2A">今日の買い物</text><rect x="892" y="410" width="358" height="152" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="908" y="454" font-size="20" font-weight="700" fill="#172B2A">みなとの言葉</text><text x="908" y="498" font-size="20" font-weight="400" fill="#172B2A">肉は少ない方にした。今日は使う</text><text x="908" y="530" font-size="20" font-weight="400" fill="#172B2A">分だけでよかったから。</text><rect x="892" y="578" width="358" height="152" rx="16" fill="#FFFFFF" stroke="#176B5B"/><text x="908" y="622" font-size="20" font-weight="700" fill="#172B2A">気が向いたら</text><text x="908" y="666" font-size="20" font-weight="400" fill="#172B2A">読んだよ・自分の経験・質問を返</text><text x="908" y="698" font-size="20" font-weight="400" fill="#172B2A">す</text><text x="908" y="766" font-size="20" font-weight="400" fill="#176B5B">あとで読む</text><text x="908" y="818" font-size="20" font-weight="400" fill="#176B5B">読んだよ（返事は任意）</text><path d="M876 866H1266" stroke="#176B5B" fill="none"/><text x="888" y="894" font-size="20" font-weight="700" fill="#176B5B">家族の新聞</text><text x="1018" y="894" font-size="20" font-weight="400" fill="#176B5B">今日を送る</text><text x="1148" y="894" font-size="20" font-weight="400" fill="#176B5B">これまで</text><text x="32" y="1105.1999999999998" font-size="16" fill="#172B2A">架空の例・設計図。保存・共有・受取は別の状態です。製品実装と利用者検証は未実施。</text></g></svg>
