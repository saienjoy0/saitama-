<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#193d32;background:#f7faf7;--green:#176b5b;--line:#dce9df}

.promptlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}

.next{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:7px}.next button{font-size:12px;white-space:nowrap;background:#eff8f0;min-height:35px;border:1px solid #cbded0;border-radius:999px;padding:6px 10px}
.inputrow{display:flex;gap:7px}.inputrow textarea{flex:1;min-width:0;resize:vertical;min-height:49px;max-height:85px;border:1px solid #d0e1d6;border-radius:12px;padding:12px;font-size:16px;background:#fff}
.mic,.send{display:grid;place-items:center;min-height:49px;min-width:48px;border:0;border-radius:12px;background:#176b5b;color:white;font-size:23px}.mic{background:#e8f4eb;color:#126450;border:1px solid #bcddc5}
.status{min-height:0;font-size:11px;color:#4f7c65;margin:4px 0 0}.status:empty{display:none}
.dropdown{position:absolute;top:62px;right:9px;z-index:20;background:#fff;border:1px solid #cce0d1;border-radius:15px;padding:10px;box-shadow:0 12px 36px #173b3150;display:grid;gap:6px;max-width:calc(100vw - 18px)}.dropdown[hidden]{display:none}
.dropdown button{text-align:left;background:#f6faf7;color:#265a45;border:1px solid #d6e5da;border-radius:12px;padding:12px;min-height:45px}
@media(min-width:780px){.app{border-radius:14px;margin-top:12px;height:calc(100dvh - 24px);box-shadow:0 12px 45px #173b3120}}

.stagepill{font-size:12px;color:#3a7e60;background:#f0f8f1;border:1px solid #d8eadc;padding:8px 12px;border-radius:12px;margin:10px 0;font-weight:800}

.comparison tr:nth-child(even){background:#f8fbf8}

.reasonTag{color:#237057;font-weight:850;font-size:12px}

.reasonDetails summary,.openingEvidence summary{cursor:pointer;color:#1c765a;font-weight:800;min-height:34px;display:flex;align-items:center}
.basisItem{padding:8px 0;border-bottom:1px solid #e1eee4}.basisItem:last-child{border:0}
.basisKey{font-size:12px;font-weight:850;color:#466f5a}.basisItem ul{padding-left:1.2em;margin:6px 0}.basisItem li{margin:4px 0;line-height:1.6}
.basisItem.hypothesis .basisKey{color:#9c6724}.basisItem.unverified .basisKey{color:#805f4b}
.openingEvidence{margin-top:9px;border-top:1px solid #cce3d3;padding-top:6px}.openingEvidence p{font-size:12px!important;line-height:1.65!important;font-weight:400!important;color:#54765f}
@media(max-width:390px){.reasonSummary{font-size:14px}}

/* Same four-person cycle as GitHub review PR #13; standalone mobile layout. */

.familyRoles button{border:1px solid #dae8dd;background:#f7faf7;border-radius:10px;min-width:74px;flex:1;min-height:44px;color:#315e48;font-weight:750;font-size:13px}
.familyRoles button[aria-pressed=true]{background:#176b5b;color:white;border-color:#176b5b}
#familyMain{min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:14px 14px 28px}
#familyMain[hidden]{display:none} .dock[hidden],#main[hidden]{display:none}
.familyBox{border:1px solid #d7e6dd;background:white;border-radius:15px;padding:13px;margin:12px 0;line-height:1.65}
.familyBox strong{display:block;margin-bottom:8px}.familyBox h2{font-size:19px;margin:2px 0 8px}
.familyBox p{font-size:14px}.familyBox .tiny{font-size:12px;color:#608272}

.familyBox textarea{width:100%;min-height:85px;border:1px solid #b7d8c2;border-radius:10px;padding:10px;font-size:16px;resize:vertical}

.familyBox.news{background:#fff9ef;border:1px solid #d9caae}.familyBox.news h2{text-align:center;border-top:3px double #b49a78;border-bottom:1px solid #d9c8af;padding:12px 2px;font-family:serif}

/* 親も子と同じ余白・カード・一画面一判断を使う。子の既存AI会話UIは維持。 */
.familyRoles button{min-width:0;flex:1 1 0;font-size:14px}
.familyBox{padding:15px;border-radius:16px;box-shadow:0 2px 15px #153d2b05}
.parentOverview{border:1px solid #cde3d2;background:#edf7ef;border-radius:15px;padding:14px;margin:10px 0}
.parentOverview p{font-size:13px;margin:5px 0}
.parentTabs{display:flex;gap:7px;overflow-x:auto;margin:12px 0;scrollbar-width:none}
.parentTabs button{background:#f5faf6;color:#2a6450;border:1px solid #d2e7d9;border-radius:11px;min-height:48px;padding:9px 12px;flex:1;white-space:nowrap;font-weight:800;font-size:13px}
.parentTabs button[aria-selected="true"]{background:#176b5b;border-color:#176b5b;color:#fff}

.parentAi p{margin:0;font-size:14px;line-height:1.7}
.parentStatus{font-size:12px;display:inline-block;border-radius:99px;background:#ebf5ed;color:#47775c;padding:5px 9px;font-weight:750}

.parentAction{display:grid;gap:5px;margin-top:12px}
.parentAction .act{display:block;width:100%;margin:2px 0!important;text-align:center}
.parentSectionTitle{margin:17px 0 6px;font-size:16px;color:#325e49}
.parentEvidence{font-size:12px;color:#54745e;border-top:1px solid #deebe0;margin-top:10px;padding-top:10px}
.parentMeta{font-size:12px;color:#657c6a}
.parentSummary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.parentSummary span{background:#fff;border:1px solid #d7e7dd;border-radius:10px;padding:8px 10px;font-size:12px}
.grandma #familyMain .familyBox .act{min-height:56px;font-size:16px}
#familyMain h1{font-size:23px;margin:5px 0 10px;letter-spacing:-.03em}
#familyMain .eyebrow{font-size:12px;font-weight:850;color:#287456}
#familyMain .familyBox h2{font-size:18px}

.cycleAccordion{margin-top:10px;border:1px solid #d4e6da;border-radius:14px;background:#fff}

.cycleAccordion[open]>div{padding:0 10px 12px}
@media(max-width:390px){.familyRoles button{font-size:12px;min-width:0}.parentTabs button{font-size:12px;padding:8px}}
/* Attachment layout retained; wrap examples and keep all content inside scroll rows. */
main,#familyMain,.familyBox,.tile{overflow-wrap:anywhere}
.next button{max-width:280px;white-space:normal;flex-shrink:0;text-align:left}
.next{max-height:76px;overflow:auto}
button:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #976016;outline-offset:2px}
.familyBox input,.familyBox select{max-width:100%;min-height:44px;font:inherit;padding:8px;border:1px solid #b7d8c2;border-radius:9px}
.familyBox label{display:block;margin:9px 0 4px}.tiny{font-size:12px;color:#416a56;line-height:1.65}

<body>
<div class="app" id="appCycle">
<header><div class="brand"><span class="star">✦</span>やってみクエスト</div><button id="choose" class="headbtn" aria-expanded="false">📚 クエスト ▾</button></header>
<nav id="menu" class="dropdown" hidden>
<button data-scene="dinner">🍛 夕飯づくり</button>
<button data-scene="family">🏠 親子の約束</button>
<button data-scene="research">🔎 家の調査</button>
</nav>
<div class="demoNotice">模擬AI・架空の家族体験｜記録はこの画面内のみ。再読込で消えます。</div>
<nav class="familyRoles" id="familyRoles" aria-label="体験する家族を選ぶ">
<button data-role="child" aria-pressed="true">👧 はる</button>
<button data-role="parent" aria-pressed="false">👨‍👩‍👧 保護者</button>
<button data-role="grandparent" aria-pressed="false">👵 祖父母</button></nav>
<main id="familyMain" hidden aria-label="家族の記録と確認"></main><main id="main" aria-label="はるちゃんの体験">
<div class="eyebrow" id="label">実践クエスト</div>
<h1 id="title"></h1>
<section id="quest" class="quest"><div class="ico" id="emoji"></div><div><strong id="questname"></strong><p id="questdesc"></p></div></section>
<section id="start" class="question"><small>✦ AIからの最初の提案</small><p id="firstQuestion"></p><span id="nudge"></span><details id="openingEvidence" class="openingEvidence"><summary>どうしてこの候補なの？</summary><p id="openingReasonText">前回の家庭調査（発表用の架空の記録）に米・玉ねぎ・にんじん・ルーがありました。今日の在庫は未確認です。家族の好み・経験は本人が話したときだけ使います。</p></details></section>
<div id="promptLabel" class="eyebrow">話す言葉の例</div>
<nav id="prompts" class="promptlist"></nav>
<div id="stagePill" class="stagepill" aria-live="polite"></div>
<div id="history"></div>
<div id="result"></div><div id="cycleSave"></div><div id="cycleAlbum"></div>
</main>
<div class="dock" id="childDock">
<div id="next" class="next"></div>
<div class="inputrow"><textarea id="input" rows="1" aria-label="はるちゃんが話す言葉" placeholder="自分の言葉で話してね"></textarea><button type="button" class="mic" id="mic" aria-label="マイクを使う">🎙</button><button type="button" class="send" id="send" aria-label="AIに相談する">➤</button></div>
<p class="status" id="status" role="status"></p>
</div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>n==null?'未確認':Number(n).toLocaleString('ja-JP')+'円';
const scenes={
 dinner:{label:'実践クエスト',title:'おばあちゃんと食べる夕飯を考えよう',quest:'おばあちゃんを迎える夕飯',desc:'献立を考え、家族に相談して、実際に作ろう',emoji:'🍛',question:'はるちゃん、おばあちゃんの夕飯を考えよう。前に米・玉ねぎ・にんじん・ルーがあったよね。今日も使えるならカレーはどうかな？',nudge:'理由：前回の家庭調査の記録を使った候補だよ。今の在庫はまだ未確認。別の料理を選んでもいいよ。',prompts:['カレーを作りたい','家庭科でカレーを作ったことがある','別の料理も考えたい']},
 family:{label:'初回の約束',title:'夕飯のこと、どこまで自分でやってみたい？',quest:'自分で決めていいことを考えよう',desc:'希望を家族に伝え、任される範囲を相談',emoji:'🏠',question:'はるちゃん、献立を決めることと買い物、どっちを自分でやってみたい？',nudge:'まず自分の希望を一つ教えてね。',prompts:['献立を自分で決めたい','買い物もやってみたい','まだ決まっていない']},
 research:{label:'調査クエスト',title:'夕飯の前にある仕事を探そう',quest:'家の仕事とお金を調べよう',desc:'家族に聞いて、改善を一つ試す',emoji:'🔎',question:'夕飯を作る前って、料理以外にどんな準備があると思う？',nudge:'分からなければ家族に聞いてみよう。',prompts:['買い物に行くこと','冷蔵庫を確認すること','分からない']}
};
const steps=[['menu','献立'],['scope','家族の条件'],['stock','家の材料'],['needed','買う物'],['prices','店の値段'],['preference','店の候補'],['pickupRequest','相談する'],['pickupResponse','家族の返答'],['finalChoice','自分で決める'],['meatCompare','売り場で比較'],['meatChoice','商品を選ぶ'],['execute','実際にやる'],['reflect','記録']];
const phases=steps.map(x=>x[0]);
function newState(){return {phase:'menu',facts:{},turns:[],done:false}}
// 発表用の架空の過去記録。今日の在庫を確認した事実とは区別する。
const demoHistory={dinner:{pastIngredients:['米','玉ねぎ','にんじん','ルー'],origin:'前回の家庭調査（合成記録）',currentConfirmed:false}};

const states={dinner:newState(),family:newState(),research:newState()};
let scene='dinner',recognition=null;
const example={
 menu:['カレーを作りたい。家庭科で作ったことがある','おばあちゃんは私が作るカレーが好き','別の料理にしたい'],
 scope:['家族に聞いた。4人分で予算は1000円。調理は親と一緒にする','家族に人数と予算を聞いてくる'],
 stock:['米、玉ねぎ、にんじん、ルーは4人分使えるだけあった','冷蔵庫を見てきた'],
 needed:['ルーの箱と家族に確認した。肉400gとじゃがいも1袋が足りない。トマト2個も出したい','まだ必要な材料を調べてない'],
 prices:['A店は肉520円、じゃがいも260円、トマト200円。B店は肉480円、じゃがいも240円、トマト200円','お店の値段を調べてくる'],
 preference:['B店が60円安いから、B店に行きたい','まだ決めてない'],
 pickupRequest:['荷物が重そうだから父に迎えを頼みたい。どう言えばいい？','家族に相談してくる'],
 pickupResponse:['父に聞いた。A店なら16時30分、B店なら17時。16時45分までに帰る約束','まだ返事を聞いていない'],
 finalChoice:['A店にする。予算内で早く帰れるから。父もA店なら迎えられると言ってくれた','どちらがいいか迷ってる'],
 meatCompare:['A店で肉400gが520円、600gが600円だった。どちらがお得？','売り場で価格を見てくる'],
 meatChoice:['400gを選ぶ。今日は400gで足りるし、トマトも買いたい','まだ迷っている'],
 execute:['A店で400gの肉とじゃがいもとトマトを980円で買った。父と帰り、親とカレーを作った','まだ買い物していない'],
 reflect:['B店は安かったけど、父の迎えに合うA店を選んだ。次は2日分なら大きい肉も考えたい','この内容で下書きを確認したい']
};
const dishes=['カレー','オムライス','シチュー','ハンバーグ','パスタ','うどん','焼きそば','チャーハン'];
function normalize(t){return String(t).replace(/[０-９]/g,k=>String(k.charCodeAt(0)-65296)).replace(/\s/g,'')}
function extract(t,f){
 const a=normalize(t);
 for(const x of dishes)if(a.includes(x)&&/作りたい|作ることに|にする|にしたい|に決め|作ろう|がいい/.test(a))f.dish=x;
 if(/家庭科/.test(a)&&/カレー/.test(a)&&/作った|作る|習った|経験/.test(a))f.schoolCurryExperience=true;
 // 本人が明示して初めて、祖母の好みの情報として使う。
 if(/(?:おばあちゃん|祖母)/.test(a)&&/カレー/.test(a)&&/好き/.test(a)){
   f.grandmaLikesCurry=true;
   f.grandmaLikesHaruCurry=/私|わたし|僕|ぼく|はる|自分/.test(a);
 }
 if(/別の料理|カレー以外/.test(a))f.differentDishRequested=true;

 let m=a.match(/(\d+)人(?:分)?/);if(m)f.people=Number(m[1]);
 m=a.match(/(?:予算|上限)(?:は|が|で|を|:|：)?([\d,]+)円/);if(m)f.budget=Number(m[1].replace(/,/g,''));
 if(/(?:親|お父さん|お母さん|父|母)と一緒に(?:調理|作る|料理)|調理は(?:親|父|母)と一緒|親と一緒/.test(a))f.parentCooking=true;
 const found=['米','玉ねぎ','にんじん','ルー'];
 if(/ある|あった|残って|使える/.test(a)){
  for(const x of found)if(a.includes(x)){f.stock??=[];if(!f.stock.includes(x))f.stock.push(x)}
  if(/4人分(?:使える|足りる)/.test(a))f.stockServingsConfirmed=true;
 }
 if(/肉(?:は|が)?400(?:g|グラム)/.test(a))f.meatNeeded=true;
 if(/じゃがいも/.test(a)&&/(?:足りない|買う|必要|買い足す)/.test(a))f.potatoNeeded=true;
 if(/トマト(?:2個)?/.test(a)&&/(?:出したい|買う|必要|買い足す)/.test(a))f.tomatoNeeded=true;
 if(/16時45分(?:まで|には)/.test(a))f.homeDeadline='16:45';
 for(const m of a.matchAll(/([AB])店(?:なら|は|で|だと)?(\d{1,2})時(?:(\d{1,2})分)?/g))f[m[1]+'Pickup']=m[2].padStart(2,'0')+':'+(m[3]||'0').padStart(2,'0');
 const chunks=a.split(/(?=[AB]店(?:は|:|：))/).filter(x=>/^[AB]店/.test(x));
 for(const ch of chunks){const shop=ch[0];let mm=ch.match(/肉(?:400(?:g|グラム))?(?:が|は|なら)?([\d,]+)円/);if(mm)f[shop+'Meat']=Number(mm[1].replace(/,/g,''));mm=ch.match(/じゃがいも(?:1袋)?(?:が|は|なら)?([\d,]+)円/);if(mm)f[shop+'Potato']=Number(mm[1].replace(/,/g,''));mm=ch.match(/トマト(?:2個)?(?:が|は|なら)?([\d,]+)円/);if(mm)f[shop+'Tomato']=Number(mm[1].replace(/,/g,''));}
 for(const m of a.matchAll(/(400|600)(?:g|グラム)(?:が|は|なら|で)?([\d,]+)円/g))f['pack'+m[1]]=Number(m[2].replace(/,/g,''));
 if(/A店(?:にする|を選|で買う|に決め)/.test(a))f.selectedStore='A';
 if(/B店(?:にする|を選|で買う|に決め)/.test(a))f.selectedStore='B';
 if(/父も|父が|お父さんも/.test(a)&&/迎えられる|いいと言った|OK|了承/.test(a))f.pickupAgreement=true;
}
const E=(text)=>esc(text);

// 公開用の説明根拠。モデルの内部思考ではなく、利用した観察・出所・仮説・次の確認を短く整理。
function explain(turn,st,phaseBefore){
 const f=st.facts,phase=phaseBefore,t=turn,known=[],possible=[],unknown=[],alternatives=[];
 let headline='今わかっていることを整理して、次の行動を一つ提案しているよ。';
 const reported=(v)=>known.push('はるちゃんの報告：'+v);
 if(scene==='dinner'){
  switch(phase){
   case 'menu':
    headline='前回の材料記録や本人の経験を手がかりに、実際に作れそうな献立を考えたよ。';
    known.push('前回の家庭調査（デモ記録）：米・玉ねぎ・にんじん・ルーがあった');
    if(f.schoolCurryExperience)reported('家庭科でカレーを作った経験がある');
    if(f.grandmaLikesCurry)reported(f.grandmaLikesHaruCurry?'おばあちゃんは、はるちゃんの作るカレーが好き':'おばあちゃんはカレーが好き');
    if(f.dish)reported('今回作りたい料理は'+f.dish);
    possible.push('材料が今も残っていれば、カレーの買い足しを減らせるかもしれない');
    unknown.push('今日使える食材の有無、家族の希望、必要な人数と予算');
    alternatives.push('別の料理を選ぶ・家族に食べたい物を聞く');break;
   case 'scope':
    headline='材料の量や買う予算は、食べる人数と家族の約束で変わるから確認しよう。';
    if(f.people)reported(f.people+'人分');if(f.budget)reported('予算'+yen(f.budget));
    unknown.push(...(!f.people?['食べる人数']:[]),...(!f.budget?['家族が許可した予算']:[]),...(!f.parentCooking?['調理を手伝う人']:[]));
    alternatives.push('家族が忙しければ、話せるときまで保留する');break;
   case 'stock':
    headline='前にあった材料が今もあるとは限らない。実物を見てから買う物を考えよう。';
    known.push('前回の家庭調査（デモ記録）：材料があった');
    if(f.stock?.length)reported('今回見つけたもの：'+f.stock.join('・'));
    possible.push('使える材料が多ければ、買い足す物を減らせるかもしれない');
    unknown.push('残っている量と今回使ってよいか');break;
   case 'needed':
    headline='買い物リストは、作る人数・レシピの必要量・今の在庫の差で決まるからだよ。';
    if(f.stock?.length)reported('使えると確認した材料：'+f.stock.join('・'));
    unknown.push('箱やレシピの分量、追加したい付け合わせ');
    alternatives.push('買い足しが多ければ献立や量を家族と見直す');break;
   case 'prices':
    headline='買う物と量が決まったので、同じ量で店の値段を比べられるよ。';
    if(f.meatNeeded)reported('肉400gが必要');
    if(f.AMeat!=null)reported('A店の肉'+yen(f.AMeat));
    if(f.BMeat!=null)reported('B店の肉'+yen(f.BMeat));
    unknown.push('未確認の商品の価格や当日の売り場価格');break;
   case 'preference':
    headline='安い店は候補になるけれど、時間・運び方・家族の都合も選択条件だからだよ。';
    if(f.totalA!=null)reported('A店合計'+yen(f.totalA));if(f.totalB!=null)reported('B店合計'+yen(f.totalB));
    unknown.push('帰宅時間と荷物の運び方');alternatives.push('予算・帰宅の約束を優先して別の案にする');break;
   case 'pickupRequest':
    headline='帰りの荷物や移動の条件は、実際に家族へ聞かないと分からないからだよ。';
    reported('家族への相談が必要と考えた');unknown.push('お父さんが迎えられるかと、その時間');
    alternatives.push('迎えが難しければ買う量や店を家族と変更する');break;
   case 'pickupResponse':
    headline='お父さんの返答を価格と並べると、実行できる案か比べやすくなるよ。';
    if(f.APickup)reported('A店の迎え'+f.APickup);if(f.BPickup)reported('B店の迎え'+f.BPickup);
    if(f.homeDeadline)reported('帰宅の約束'+f.homeDeadline);
    unknown.push('迎えの最終合意');break;
   case 'finalChoice':
    headline='最安値だけで決めず、予算と時間と家族の約束を合わせるためだよ。';
    if(f.selectedStore)reported(f.selectedStore+'店を選ぶ');if(/から|ので|ため/.test(t))reported('本人が話した選択理由：'+t);
    unknown.push('お父さんと最終確認できたか');alternatives.push('選ぶ店・買い物時間・買う量を再検討');break;
   case 'meatCompare':
    headline='100gあたりの単価と支払う合計は別。必要量と予算を一緒に見るためだよ。';
    if(f.pack400!=null)reported('400gが'+yen(f.pack400));if(f.pack600!=null)reported('600gが'+yen(f.pack600));
    unknown.push('今日必要な量と余りの使い道');alternatives.push('安い単価より必要量と合計を重視する');break;
   case 'meatChoice':
    headline='選ぶ理由は安さだけではなく、食べる量や一緒に買いたい物にもあるよ。';
    reported('本人の選択：'+t);unknown.push('実際に売り場で買えるか');break;
   case 'execute':
    headline='予定したことと実際にしたことを分けて、正しく記録するためだよ。';
    reported('今回の報告：'+t);unknown.push('購入・調理・食事のうち未報告の部分');break;
   case 'reflect':
    headline='最後に選んだ理由を残すと、何を考えて行動したか振り返れるからだよ。';
    reported('振り返り：'+t);alternatives.push('共有しない・自分の言葉で修正する');break;
  }
 }else if(scene==='family'){
   headline='はるちゃんの希望と、親が任せてよい範囲は違うことがあるから、相談して決めるんだよ。';

 }else{
   headline='家の仕事やお金の流れは、実際に家族に聞くことで確かめられるからだよ。';
   reported('はるちゃんが話したこと：'+t);unknown.push('まだ家族に聞いていない仕事や支出');alternatives.push('聞けた範囲だけで一つ提案して試す');
 }
 return {headline,known,possible,unknown,alternatives};
}
function reasonUI(ex){
 let lines='';
 const part=(type,caption,values)=>values.length?'<div class="basisItem '+type+'"><span class="basisKey">'+E(caption)+'</span><ul>'+values.map(v=>'<li>'+E(v)+'</li>').join('')+'</ul></div>':'';
 lines+=part('confirmed','出所のある情報',ex.known);
 lines+=part('hypothesis','AIの見込み（まだ確定ではない）',ex.possible);
 lines+=part('unverified','確認が必要',ex.unknown);
 lines+=part('alternative','他の選び方',ex.alternatives);
 return '<section class="reasonBox" aria-label="AIの提案理由"><div class="reasonTag">💡 この提案の理由</div><p class="reasonSummary">'+E(ex.headline)+'</p><details class="reasonDetails"><summary>何を根拠にしたの？</summary>'+lines+'</details></section>';
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$('mic').onclick=()=>{
 if(!SR){$('status').textContent='このブラウザーでマイクが使えません。文字入力でも続けられます。';return}
 if(recognition){recognition.stop();recognition=null;return}
 const r=new SR();recognition=r;r.lang='ja-JP';r.interimResults=false;r.continuous=false;
 r.onresult=e=>{const transcript=e.results[0]?.[0]?.transcript;if(transcript){$('input').value=transcript;send('mic')}};
 r.onerror=()=>{$('status').textContent='聞き取れませんでした。文字で入力できます。'};
 r.onend=()=>{recognition=null;$('mic').textContent='🎙'};
 try{r.start();$('mic').textContent='■';$('status').textContent='聞き取り中です…'}catch(e){recognition=null;$('status').textContent='マイクが起動できませんでした。文字入力で続けてね。'}
};

/* Separate simulated family-publication/reward state: it is NOT a live shared backend. */
const cycle={role:'child',parentTab:'checks',agreement:'pending',save:{dinner:false,family:false,research:false},share:{dinner:'private',family:'private',research:'private'},text:{},versions:{dinner:0,family:0,research:0},award:{dinner:'none',research:'none'},pointsUsed:'none',posts:[],replies:[],issues:0,message:''};
const titles={dinner:'おばあちゃんと夕飯を考えた日',family:'家族と初めての約束',research:'家の仕事を調べた日'};
const safeSummary={dinner:'はるはおばあちゃんの夕飯について、家の材料や買い物の条件を考えました。',family:'はるは献立を自分で考えてみたいと家族に伝えました。',research:'はるは夕飯前に家族がしている仕事を調べました。'};
function cyBtn(msg,cmd,alt=false){return '<button type="button" class="act'+(alt?' alt':'')+'" data-cycle="'+cmd+'">'+esc(msg)+'</button>'}
function cyStatus(id){return ({private:'非公開',requested:'保護者の確認待ち',returned:'保護者が修正・はるの再確認待ち',published:'祖母に公開済み',held:'共有保留'}[cycle.share[id]]||cycle.share[id])}
function cyPoints(){return (cycle.award.research==='earned'?20:0)+(cycle.award.dinner==='earned'?40:0)}
function cyFree(){return cyPoints()-(['reserved','approved','delivered'].includes(cycle.pointsUsed)?50:0)}
function cyRecordedText(id){
 const st=states[id];if(!st||!st.turns.length)return '';
 const f=st.facts||{};
 if(id==='dinner'){
  if(f.executionText){return '本人が報告したこと：'+f.executionText+(f.reflectionText?' ／ 選んだ理由：'+f.reflectionText:'');}
  return '途中の記録（未実施を含む）：'+st.turns.at(-1).text;
 }
 return '本人が話したこと：'+st.turns.at(-1).text;
}
function cyPublicationDraft(id){
 const f=states[id]?.facts||{};
 if(id==='dinner'&&f.executionText){return 'はるちゃんの報告：'+f.executionText+(f.reflectionText?'。どうしてそう決めたか：'+f.reflectionText:'');}
 return 'はるちゃんからの記録：'+(states[id]?.turns.at(-1)?.text||'');
}
function cyPreview(id,forChild=true){
 return '<div class="familyBox"><strong>'+esc(titles[id])+'</strong><span class="stateTag">'+cyStatus(id)+'</span><p>'+esc(cyRecordedText(id))+'</p>'+
 (forChild&&(cycle.share[id]==='private'||cycle.share[id]==='held')?cyBtn('おばあちゃんにも見せたい','share:'+id,true):'')+
 (forChild&&cycle.share[id]==='returned'?'<p class="tiny">保護者の修正案：'+esc(cycle.text[id]||'')+'</p>'+cyBtn('修正案を確認して、もう一度お願いする','resubmit:'+id,true):'')+'</div>';
}
function cyActivityReady(id){
 if(id==='dinner')return Boolean(states.dinner.done&&states.dinner.facts.executionText);
 if(id==='research')return states.research.turns.some(t=>/出発前|店に入る前/.test(t.text)&&/伝えた|知らせた|試した/.test(t.text));
 return false;
}

function renderChildCycle(){
 const id=scene,has=states[id].turns.length>0,ready=cyActivityReady(id);
 const hint=id==='dinner'&&!states.dinner.done?'夕飯はまだ進行中です。途中まででも保存できます。':id==='research'&&!ready?'実際に試したと報告した後、保護者がポイントを確認できます。':'自分の言葉を残せます。祖母に見せるかはあとで選べます。';
 $('cycleSave').innerHTML=has?'<div class="familyBox"><h2>📖 今日の発見を残そう</h2><div class="parentChild"><div class="by">今の本人の言葉</div><p>'+esc(states[id].turns.at(-1).text)+'</p></div><p class="tiny">'+esc(hint)+'</p>'+(cycle.save[id]?'<span class="stateTag">自分のアルバムに保存済み（このデモ内）</span>':cyBtn('自分のアルバムに保存する','save:'+id))+'<p class="tiny">保存と祖母への共有は別。家族が読める記事は自分で選べます。</p></div>':'';
 const saved=Object.keys(cycle.save).filter(x=>cycle.save[x]);
 $('cycleAlbum').innerHTML='<details class="cycleAccordion" id="albumFold"><summary>📚 これまでのアルバム　'+saved.length+'件</summary><div>'+(saved.length?saved.map(x=>cyPreview(x)).join(''):'<p class="tiny">まだ保存した出来事はありません。</p>')+'</div></details>'+
 '<details class="cycleAccordion" id="rewardFold"><summary>🎁 お金とごほうび　使える '+cyFree()+'P</summary><div><p>確定 '+cyPoints()+'P ／ 使える '+cyFree()+'P</p><p class="tiny">調査20P・夕飯40Pは架空の事前合意例。保護者が実際の報告を確認したあとだけ確定。新聞への共有や祖母の返信は条件ではありません。</p>'+
 (cycle.pointsUsed==='none'||cycle.pointsUsed==='cancelled'?(cyFree()>=50?cyBtn('カフェ50Pをお願いする','request',true):'<p class="tiny">カフェは50Pから。確認済みのポイントが貯まってからお願いできるよ。</p>'):'<p class="tiny">カフェの特典：'+({reserved:'50P予約・保護者の確認待ち',approved:'交換承認済み・まだ行っていない',delivered:'実際に体験済み（デモ）'}[cycle.pointsUsed]||'確認待ち')+'</p>')+
 (cycle.pointsUsed==='reserved'?cyBtn('カフェ依頼を取り消す','cancel',true):'')+'</div></details>'+
 ((cycle.replies.length||cycle.posts.length)?'<div class="familyBox"><h2>👵 おばあちゃんから</h2>'+cycle.replies.map(x=>'<p>'+esc(x)+'</p>').join('')+cycle.posts.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>':'');
}

function parentInsight(id){
 const st=states[id],t=st.turns.at(-1);if(!t)return '<p class="parentEmpty">この体験の記録はまだありません。</p>';
 const explanation=t.reason?.headline||'本人の言葉をもとに整理しています。';
 const evidence=t.reason?.known||[];
 return '<div class="parentChild"><div class="by">🎙 はるちゃんの発言（報告）</div><p>'+esc(t.text)+'</p></div>'+
 '<div class="parentAi"><strong>✦ AIがどう整理したか</strong><p>'+esc(t.model?.say||'')+'</p><details class="reasonDetails"><summary>なぜこの提案？ 出所と未確認</summary><p>'+esc(explanation)+'</p>'+
 (evidence.length?'<p>'+evidence.map(esc).join(' ／ ')+'</p>':'')+
 ((t.reason?.unknown||[]).length?'<p>まだ確認したい：'+t.reason.unknown.map(esc).join('、')+'</p>':'')+'</details></div>';
}
function parentReviewCard(id){
 const t=states[id]?.turns.at(-1),s=cycle.share[id];
 let html='<section class="familyBox"><h2>📰 '+esc(titles[id])+'</h2>'+parentInsight(id)+'<p class="parentMeta">共有する相手：おばあちゃん ／ 内容バージョン '+cycle.versions[id]+'</p>'+
 '<div class="parentAi"><strong>新聞に掲載する文章の案</strong><p>'+esc(cycle.text[id]||cyPublicationDraft(id))+'</p></div>'+
 '<p class="tiny">本人が共有したいと選択した文章のみ。写真の選択・同意はこのデモでは未実装です。</p>';
 if(s==='requested')html+='<div class="parentAction">'+cyBtn('この文章をおばあちゃんに見せる','publish:'+id)+cyBtn('文章を修正して本人へ返す','return:'+id,true)+cyBtn('今回は保留する','hold:'+id,true)+'</div>';
 return html+'</section>';
}
function parentAwardCard(id){
 const p=id==='research'?20:40,st=cycle.award[id],r=cyActivityReady(id),saved=cycle.save[id];
 const status=st==='earned'?'活動確認済み・一度だけ確定':st==='held'?'確認を保留中':!r?'実施した報告はまだありません':!saved?'子のアルバム保存待ち':'本人からの報告・保護者の確認待ち';
 let html='<section class="familyBox"><h2>🏃 '+esc(titles[id])+'　'+p+'P</h2><span class="parentStatus '+(st==='pending'?'parentWarning':'')+'">'+esc(status)+'</span>'+parentInsight(id)+'<p class="parentEvidence">このポイントは家庭で事前に約束した場合の合成例です。子の申告と、保護者が実際に確認したことは別です。</p>';
 if(saved&&(st==='pending'||st==='held'))html+='<div class="parentAction">'+cyBtn('活動を確認して'+p+'P確定','award:'+id)+cyBtn('まだ確認しない','holdaward:'+id,true)+'</div>';
 return html+'</section>';
}
function renderOtherCycle(){
 const f=$('familyMain');if(!f)return;
 let h='';
 if(cycle.role==='parent'){
  const waiting=Object.keys(cycle.share).filter(id=>cycle.share[id]==='requested');
  const toVerify=['research','dinner'].filter(id=>cycle.save[id]&&(cycle.award[id]==='pending'||cycle.award[id]==='held'));
  h='<div class="eyebrow">保護者｜はるの記録を見て、必要な時だけ確認</div><h1>家族の記録と確認</h1>'+
  '<div class="parentOverview"><strong>今日の確認</strong><div class="parentSummary"><span>📰 共有の確認 '+waiting.length+'件</span><span>🏃 活動の確認 '+toVerify.length+'件</span><span>📚 記録 '+Object.values(cycle.save).filter(Boolean).length+'件</span></div><p>子どもの会話から、本人の発言とAIの提案理由をそのまま確認できます。記事の共有とポイント付与は別々に判断します。</p></div>'+
  '<nav class="parentTabs" aria-label="保護者の用事"><button data-parent-tab="checks" aria-selected="'+(cycle.parentTab==='checks')+'">確認する '+(waiting.length+toVerify.length)+'</button><button data-parent-tab="album" aria-selected="'+(cycle.parentTab==='album')+'">アルバム</button><button data-parent-tab="family" aria-selected="'+(cycle.parentTab==='family')+'">家族・特典</button></nav>';
  if(cycle.parentTab==='checks'){
   if(cycle.agreement==='pending'&&states.family.turns.length)h+='<div class="familyBox"><h2>🏠 最初の任せ方の約束</h2>'+parentInsight('family')+'<p class="tiny">親子が実際に話した内容を保護者が確認するまでは「約束済み」ではありません。</p>'+cyBtn('今回の約束を確認する（デモ）','agree')+'</div>';
   h+='<h2 class="parentSectionTitle">📰 新聞に見せる内容</h2>'+(waiting.length?waiting.map(parentReviewCard).join(''):'<div class="parentEmpty">今、共有の確認待ちはありません。子が選んだ記事だけ、ここに届きます。</div>');
   h+='<h2 class="parentSectionTitle">🏃 活動とポイント</h2>'+(toVerify.length?toVerify.map(parentAwardCard).join(''):'<div class="parentEmpty">活動の確認待ちはありません。本人の実施報告と保存が揃ったらここに届きます。</div>');
  }else if(cycle.parentTab==='album'){
   h+='<div class="familyBox"><h2>📚 はるの成長アルバム</h2><p class="tiny">親は、結果だけでなく本人の言葉とAIの支援を振り返れます。祖母へ自動公開はされません。</p></div>';
   const ids=Object.keys(cycle.save).filter(x=>cycle.save[x]);
   h+=ids.length?ids.map(id=>'<div class="familyBox"><h2>'+esc(titles[id])+'</h2>'+parentInsight(id)+'<p class="parentMeta">共有の状態：'+cyStatus(id)+'</p></div>').join(''):'<div class="parentEmpty">まだアルバムに保存された記録がありません。</div>';
  }else if(cycle.parentTab==='family'){
   h+='<div class="familyBox"><h2>🎁 家族のごほうび</h2><div class="parentSummary"><span>確定 '+cyPoints()+'P</span><span>使える '+cyFree()+'P</span></div><p>家族で登録した例：カフェ50P。予約、交換承認、実際に行ったかは区別します。</p>'+
   (cycle.pointsUsed==='reserved'?'<div class="parentAction">'+cyBtn('50Pの交換を承認（まだ未提供）','approve')+cyBtn('今回は却下して予約を解除','reject',true)+'</div>':cycle.pointsUsed==='approved'?'<div class="parentAction">'+cyBtn('カフェへ行ったことを確認','deliver')+cyBtn('未提供で取消・50P返還','refund',true)+'</div>':'<p class="tiny">'+(cycle.pointsUsed==='delivered'?'交換済み・カフェの実施も記録済み（デモ）':'いまは交換の承認待ちはありません。')+'</p>')+'</div>';
   h+='<div class="familyBox"><h2>📰 おばあちゃんに見せている記事</h2><p>許可済みの記事は、号を発行しなくても日付別で読めます。</p>'+Object.keys(cycle.share).filter(id=>cycle.share[id]==='published').map(id=>'<p>・'+esc(titles[id])+'</p>').join('')+cyBtn('許可済み記事を今月号にする（任意）','issue',true)+'<p class="tiny">発行した号：'+cycle.issues+'</p></div>';
   h+='<div class="familyBox"><h2>👵 おばあちゃんの近況</h2>'+(cycle.posts.length?cycle.posts.map(x=>'<div class="parentChild"><p>'+esc(x)+'</p></div>').join(''):'<p class="tiny">今日はお知らせなし。未送信から健康状態は推測しません。</p>')+'</div>';
  }
 }else{
  const ids=Object.keys(cycle.share).filter(id=>cycle.share[id]==='published');
  h='<div class="eyebrow">おばあちゃん｜家族のおたよりと私の近況</div><h1>家族からのおたより</h1>';
  h+='<div class="familyBox"><h2>きょうのおたより</h2><p>孫と保護者が見せると決めた記事だけ読めます。家計やポイントは表示しません。</p></div>';
  h+=ids.length?ids.map(id=>'<article class="familyBox news"><h2>'+esc(titles[id])+'</h2><p>'+esc(cycle.text[id]||cyPublicationDraft(id))+'</p>'+cyBtn('読んだよ','read:'+id,true)+cyBtn('私の経験を返す','reply:'+id,true)+'</article>').join(''):'<div class="familyBox"><p>今日は新しいおたよりはありません。昔の記事を読んだり、自分から「元気だよ」を送れます。</p></div>';
  h+='<div class="familyBox"><h2>これまでのおたより</h2><p>読める記事 '+ids.length+'件／新聞号 '+cycle.issues+'号</p></div>';
  h+='<div class="familyBox"><h2>私から「元気だよ」を送る</h2><p>歩数は本人が手入力。送らない日から健康状態は判断しません。</p><textarea id="gpost">元気だよ。今日は5,200歩歩いたよ。</textarea>'+cyBtn('この近況を家族に送る（デモ）','post')+'</div>';
 }
 h+='<p class="tiny">これは画面内だけの家族体験デモです。実際の送信・認証・報酬処理ではありません。</p>';
 if(cycle.message)h+='<div class="familyBox" role="status">'+esc(cycle.message)+'</div>';
 f.innerHTML=h;
}

function selectCycleRole(role){
 if(!['child','parent','grandma'].includes(role))return;
 cycle.role=role;cycle.message='';
 $('main').hidden=role!=='child';$('childDock').hidden=role!=='child';$('familyMain').hidden=role==='child';
 $('choose').hidden=role!=='child';$('appCycle')?.classList.toggle('grandma',role==='grandma');
 document.querySelectorAll('#familyRoles [data-role]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.role===role)));
 if(role==='child')renderChildCycle();else renderOtherCycle();(role==='child' ? $('main'):$('familyMain')).scrollTop=0;
}

function cycleAction(cmd){const [act,id]=cmd.split(':');cycle.message='';
 const childActs=['save','share','resubmit','request','cancel'];
 const parentActs=['agree','publish','return','hold','award','holdaward','approve','reject','refund','deliver','issue'];
 const grandActs=['read','reply','post'];
 if(childActs.includes(act)&&cycle.role!=='child')return;
 if(parentActs.includes(act)&&cycle.role!=='parent')return;
 if(grandActs.includes(act)&&cycle.role!=='grandma')return;

 if(act==='agree'&&states.family.turns.length){cycle.agreement='confirmed';cycle.message='保護者が任せ方の約束を確認しました（デモ）。'}
 if(act==='save'&&states[id].turns.length){cycle.save[id]=true;cycle.message='アルバムに非公開保存しました（画面内の合成状態）'}
 if(act==='share'&&cycle.save[id]){cycle.text[id]=cycle.text[id]||cyPublicationDraft(id);cycle.share[id]='requested';cycle.versions[id]++;cycle.message='保護者の確認待ち。祖母へは未公開です。'}
 if(act==='resubmit'&&cycle.share[id]==='returned'){cycle.share[id]='requested';cycle.message='本人が修正文を確認して再依頼しました'}
 if(act==='publish'&&cycle.share[id]==='requested'){cycle.share[id]='published';cycle.message='保護者が内容と宛先「祖母」を確認しました（模擬公開）'}
 if(act==='return'&&cycle.share[id]==='requested'){cycle.share[id]='returned';cycle.text[id]='はるは家族と相談し、今回の挑戦を進めました。';cycle.versions[id]++;cycle.message='保護者が文章を変更したので、はる本人の再確認待ちです。祖母には未公開。'}
 if(act==='hold'&&cycle.share[id]==='requested'){cycle.share[id]='held';cycle.message='共有を保留。アルバムは残ります。'}
 if(act==='award'&&cycle.save[id]&&cyActivityReady(id)&&['pending','held'].includes(cycle.award[id])){cycle.award[id]='earned';cycle.message='親の実行確認により一度だけポイントが確定。'}
 if(act==='holdaward'&&cycle.award[id]==='pending'){cycle.award[id]='held';cycle.message='活動確認を保留しました。'}
 if(act==='request'&&['none','cancelled'].includes(cycle.pointsUsed)&&cyFree()>=50){cycle.pointsUsed='reserved';cycle.message='50Pを予約。カフェにはまだ行っていません。'}
 if(act==='cancel'&&cycle.pointsUsed==='reserved'){cycle.pointsUsed='cancelled';cycle.message='予約を解除し50Pを戻しました。'}
 if(act==='reject'&&cycle.pointsUsed==='reserved'){cycle.pointsUsed='cancelled';cycle.message='保護者が却下。50Pの予約を解除しました。'}
 if(act==='approve'&&cycle.pointsUsed==='reserved'){cycle.pointsUsed='approved';cycle.message='交換を承認。特典は提供待ち。'}
 if(act==='refund'&&cycle.pointsUsed==='approved'){cycle.pointsUsed='cancelled';cycle.message='未提供で50Pを返還。'}
 if(act==='deliver'&&cycle.pointsUsed==='approved'){cycle.pointsUsed='delivered';cycle.message='カフェを体験済み（合成）。二度消費しません。'}
 if(act==='issue'&&Object.values(cycle.share).includes('published')){cycle.issues++;cycle.message='許可済み記事だけで新聞号を作りました。'}
 if(act==='read'&&cycle.share[id]==='published'){cycle.replies.push('祖母：「読んだよ」');cycle.message='任意の「読んだよ」を返しました。'}
 if(act==='reply'&&cycle.share[id]==='published'){cycle.replies.push('祖母：「私は余った肉を冷凍していたよ」');cycle.message='祖母の経験談を返しました。はるが次に使うか選びます。'}
 if(act==='post'){cycle.posts.push(($('gpost')?.value||'元気だよ').trim());cycle.message='祖母本人の近況を家族に送った模擬状態です。'}
 if(cycle.role==='child'){renderChildCycle();if(act==='save'||act==='share'||act==='resubmit'){$('albumFold')?.setAttribute('open','');}}else renderOtherCycle();
}
// Keep the child experience's existing conversation and AI reasoning UI intact.
const priorRender=render;render=function(){priorRender();renderChildCycle(); if(cycle.role!=='child')renderOtherCycle();};
document.addEventListener('click',e=>{const role=e.target.closest('#familyRoles [data-role]');if(role){selectCycleRole(role.dataset.role);return}
 const tab=e.target.closest('[data-parent-tab]');if(tab&&cycle.role==='parent'){cycle.parentTab=tab.dataset.parentTab;cycle.message='';renderOtherCycle();$('familyMain').scrollTop=0;return;}
 const c=e.target.closest('[data-cycle]');if(c)cycleAction(c.dataset.cycle)});
const priorSend=send;send=function(...args){priorSend(...args);if(scene!=='family'&&cyActivityReady(scene)&&cycle.award[scene]==='none')cycle.award[scene]='pending';renderChildCycle()};
selectCycleRole('child');

paint();
</script>
</body>
