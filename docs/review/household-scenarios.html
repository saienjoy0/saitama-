<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>やってみクエスト｜家庭体験の設計レビュー</title>
<style>
:root{color-scheme:light;--bg:#fffdf7;--paper:#fff;--ink:#172b2a;--muted:#536661;--green:#176b5b;--soft:#eaf4f0;--line:#dce5df;--amber:#754b00;--yellow:#fff3d4;--red:#a12828}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}button,input,textarea,select{font:inherit}button,select{cursor:pointer}button{min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);padding:10px 16px;text-align:left}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d49418;outline-offset:3px}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}.quiet{background:transparent}.picked{background:var(--soft);border:2px solid var(--green)}.top{background:var(--ink);color:#fff;padding:16px max(20px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:20px;font-weight:800}.top small{color:#cadbd3;font-size:13px}.top button{color:#fff;background:transparent;border-color:#5a7068;min-height:40px;font-size:14px}.wrap{max-width:1220px;padding:24px;margin:auto}.intro{margin:0 0 18px}.intro h1{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.45}.intro p{margin:8px 0;color:var(--muted)}.scenario-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.scenario-nav button{padding:14px 18px}.scenario-nav b{display:block;font-size:18px}.scenario-nav span{font-size:14px;color:var(--muted)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}.sheet{border:1px solid var(--line);border-radius:22px;background:var(--paper);overflow:hidden}.stagehead{padding:20px 26px;border-bottom:1px solid var(--line);background:var(--soft)}.stagehead .place{font-size:14px;color:var(--green);font-weight:700}.stagehead h2{font-size:25px;line-height:1.5;margin:7px 0}.progress{display:flex;gap:5px;margin:14px 0 0;list-style:none;padding:0}.progress li{height:5px;background:#cddbd3;flex:1;border-radius:10px}.progress .active{background:var(--green)}.content{padding:26px}.content h3{margin:0 0 12px;font-size:20px}.content p{margin:0 0 14px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;margin:12px 0;background:var(--paper)}.soft{background:var(--soft)}.warn{background:var(--yellow);border-color:#e8d7ad;color:var(--amber)}.error{color:var(--red);background:#fff1f1;border-color:#f0cccc}.speech{border-left:4px solid var(--green);padding:12px 16px;background:var(--soft);margin:14px 0;border-radius:0 12px 12px 0}.speech .person{display:block;font-size:14px;font-weight:700;color:var(--green)}.speech p{margin:4px 0 0}.child{border-left-color:#bb7e00;background:#fff8e8}.child .person{color:#825900}.choices{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}.choices button small{display:block;color:var(--muted);font-size:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;justify-content:space-between;gap:12px;padding:20px 26px;border-top:1px solid var(--line)}.actions .primary{margin-left:auto}.field{display:block;margin:16px 0}.field span{display:block;font-weight:600;margin-bottom:7px}.field input,.field select,.field textarea{display:block;width:100%;padding:12px;border:1px solid #b9c9c0;border-radius:10px;background:var(--paper);color:var(--ink)}textarea{min-height:110px;resize:vertical}.aside{position:sticky;top:20px}.aside section{padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--paper);margin-bottom:14px}.aside h3{font-size:16px;margin:0 0 12px}.aside p{font-size:14px;margin:8px 0}.tag{display:inline-block;padding:3px 9px;background:var(--soft);color:var(--green);border-radius:7px;font-size:13px;margin:0 5px 5px 0}.muted{color:var(--muted)}.small{font-size:14px}details{margin:16px 0}summary{cursor:pointer;color:var(--green);padding:8px 0}.facts{padding:0;list-style:none}.facts li{margin:10px 0;padding:10px;border-radius:10px;background:var(--soft);font-size:14px}.facts small{display:block;color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}.totals{display:flex;justify-content:space-between;gap:16px;background:var(--ink);color:#fff;padding:18px;border-radius:14px;margin:16px 0}.totals strong{font-size:26px;display:block}.totals small{color:#dbe8e1}.receipts{font-variant-numeric:tabular-nums}.receipt{border:1px dashed #a6b9ad;padding:20px;margin:16px 0}.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0}.check input{width:20px;height:20px;margin-top:5px;flex:none}.scene{padding:16px;background:#f4f7f4;border-radius:12px;color:var(--muted);font-size:15px}.notice{padding:12px 16px;background:var(--yellow);border-radius:10px;margin:12px 0}.foot{padding:20px 0;color:var(--muted);font-size:13px}.homecards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.homecards article{border:1px solid var(--line);border-radius:20px;background:var(--paper);padding:24px;display:flex;flex-direction:column}.homecards h2{font-size:22px;line-height:1.5}.homecards button{margin-top:auto}.num{font-size:40px;line-height:1;font-weight:500;color:var(--green)}.homecards p{color:var(--muted)}.trail{margin:12px 0;padding-left:22px}.trail li{margin:8px 0}.large{font-size:20px}.large .small,.large .aside p,.large table{font-size:18px}.large .stagehead h2{font-size:32px}.large .grid{grid-template-columns:minmax(0,1fr) 340px}
@media(max-width:850px){.grid,.large .grid{grid-template-columns:1fr}.aside{position:static}.homecards{grid-template-columns:1fr}.scenario-nav{grid-template-columns:1fr}.scenario-nav button{padding:10px 16px}.wrap{padding:16px}.content,.stagehead,.actions{padding:20px}.top{align-items:flex-start}.top small{display:block}.choices{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}@media print{.top,.scenario-nav,.actions,button,.aside{display:none}.grid{display:block}.sheet{border:none}.content{padding:0}}
</style></head><body><header class="top"><div><div class="brand">やってみクエスト</div><small>家庭体験の設計レビュー · 架空の家庭・価格・会話</small></div><div class="row"><button id="font" aria-pressed="false">文字を大きく</button><button id="home">3本の入口へ</button></div></header><main class="wrap" id="app"></main>
<script>
(function(){
'use strict';
const root=document.getElementById('app');
const titles=['うちのことを、一緒に確かめる','カレーが食卓に届くまで','夕飯の材料を、任されてみる'];
const brief=['親子で家族の役割と、今任せられる範囲を決める','家族に聞き、家の中を見て、仕組みを自分でつなぐ','在庫・人数・値段・時間・荷物を合わせて判断する'];
let context={budget:1000,level:'one',carry:1.5,setup:false,research:false,cook:'父',shopper:'母',rule:'near',insight:'',investigation:[]};
let scenario=-1,step=0,s={},history=[],large=false;
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function button(label,a,v,cl,disabled){return '<button type="button" data-action="'+a+'" data-value="'+esc(v==null?'':v)+'" class="'+(cl||'')+'"'+(disabled?' disabled':'')+'>'+label+'</button>'}
function speech(person,text,child){return '<div class="speech '+(child?'child':'')+'"><span class="person">'+esc(person)+'</span><p>'+esc(text)+'</p></div>'}
function field(label,id,value,textarea){return '<label class="field"><span>'+label+'</span>'+(textarea?'<textarea data-field="'+id+'" maxlength="600">'+esc(value||'')+'</textarea>':'<input data-field="'+id+'" maxlength="100" value="'+esc(value||'')+'">')+'</label>'}
function select(label,id,value,options){return '<label class="field"><span>'+label+'</span><select data-field="'+id+'">'+options.map(x=>'<option value="'+esc(x[0])+'"'+(String(value)===String(x[0])?' selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></label>'}
function note(text){return '<div class="notice">'+text+'</div>'}
function record(text){history.push(text)}
function start(n){scenario=n;step=0;history=[];s={seen:[],reason:'',notebook:'',claim:'',focus:'stock',hint:false,voice:false,shared:false,proposal:'',familyConfirmed:false,people:3,budget:context.budget,store:'near',meat:'small',potato:'small',meatCount:1,potatoCount:1,side:true,roux:false,help:'self',asked:[],changed:false,grandMessage:false,receipt:false,stock:n===2&&context.research&&context.investigation.includes('stock'),leftover:false,negotiated:false};record('開始：'+titles[n]);render()}
function nav(){return '<nav class="scenario-nav" aria-label="シナリオを選ぶ">'+titles.map((t,i)=>button('<b>'+String(i+1)+' · '+t+'</b><span>'+brief[i]+'</span>','start',i,i===scenario?'picked':'')).join('')+'</nav>'}
function side(){
const facts=scenario===1?s.seen.map(k=>sources[k]):scenario===2?(s.stock?[{label:'家の在庫',text:'米・玉ねぎ2個・にんじん1本・ルー3人分。肉とじゃがいもはない。'}]:[]):[];
const current=scenario===2?plan():null;
return '<aside class="aside"><section><h3>この家庭の前提</h3><p><b>はる · 小学5年生</b><br>父・母と3人暮らし。祖母は別居。</p><p>両親は働いている。日によって家事を分担。</p><p>買い足す予算：'+(scenario===2?s.budget:context.budget)+'円<br>今まで：'+(context.level==='one'?'頼まれた1品を買ったことがある':'親と一緒に選んだことがある')+'</p><p>ルール：'+(context.rule==='near'?'一人で行けるのは近所のA店。B店は親と一緒。':'初めての買物は親と一緒。')+'<br>本人だけで運ぶ目安：'+context.carry+'kg</p><p class="small muted">'+(context.setup?'①で確認した条件を引き継いでいます。':'初回の見本設定です。①で変更できます。')+'</p></section>'+
(facts.length?'<section><h3>確かめた情報</h3><ul class="facts">'+facts.map(f=>'<li>'+esc(f.text)+'<small>出所：'+esc(f.label)+'</small></li>').join('')+'</ul></section>':'')+
(current?'<section><h3>今の計画</h3><p>'+esc(s.menu||'カレー')+' · '+s.people+'人分</p><p>'+current.total+'円 / 予算'+s.budget+'円<br>'+current.weight.toFixed(1)+'kg / '+(s.help==='meet'?'父と運ぶ':s.help==='together'?'母と運ぶ':'自分で運ぶ')+'<br>戻る予定 '+current.returnTime+'</p></section>':'')+
'<section><details><summary>設計との対応を見る</summary><p>系統：本体設計 / D90<br>用途：利用体験の合成レビュー。実家庭の結果ではありません。</p><p>① F01・F02 / P05・C01<br>家族の実情・任せる範囲は今回の具体化案。</p><p>② F03〜F05 / C01・C02<br>③ F04〜F08 / C02〜C04<br>支援：F18の監修済み手順を表示する見本。</p><p>声の入力・記録整理は見本です。AI通信、実際の買物や通知はありません。</p><p>未決：家族条件の保存項目、情報の更新、相談の扱い、音声整理の契約。</p><p>記録の保存と共有は別。本人と管理する親が見る記録を基本にしています。</p></details>'+button('判断の履歴を書き出す','export',null,'quiet')+'</section></aside>'}
function shell(place,title,body,nextLabel,nextAction,disabled,total){
root.innerHTML=nav()+'<div class="grid"><article class="sheet"><div class="stagehead"><div class="place">'+place+' · '+String(step+1)+' / '+total+'</div><h2 tabindex="-1" id="scene-title">'+title+'</h2><ol class="progress" aria-label="進行 '+String(step+1)+' / '+total+'">'+Array.from({length:total},(_,i)=>'<li class="'+(i<=step?'active':'')+'"></li>').join('')+'</ol></div><div class="content">'+body+'</div><div class="actions">'+(step?button('前の場面へ','back',null,'quiet'):button('入口へ','home',null,'quiet'))+(nextLabel?button(nextLabel,nextAction||'next',null,'primary',disabled):'')+'</div></article>'+side()+'</div><footer class="foot">このデモは架空の家庭の代表場面です。入力は画面を再読み込みすると初期状態に戻ります。実家庭の個人情報は入力しないでください。</footer>';
}
function render(){if(scenario===-1){root.innerHTML='<div class="intro"><h1>子どもが調べて、決めて、やってみる。</h1><p>同じ家庭の3つの体験を、操作して確かめます。どの場面からでも開けます。</p></div><div class="homecards">'+titles.map((t,i)=>'<article><div class="num">0'+(i+1)+'</div><h2>'+t+'</h2><p>'+brief[i]+'</p>'+button('この体験を開く','start',i,'primary')+'</article>').join('')+'</div><div class="card soft"><b>今回確かめること</b><p>必要な情報がないとき、子どもは誰に何を聞くか。調べた結果で、選び方はどう変わるか。家族の条件が変わっても、自分で計画を直せるか。</p><span class="tag">設計段階の見本</span><span class="tag">会話・調査・計画の分岐あり</span><span class="tag">外部通信なし</span></div>';return}
if(scenario===0)setup();else if(scenario===1)research();else practice();
}
function setup(){
let body='',place='親子で · 家のテーブル',title='',next='次の場面へ',act='next',disabled=false;
if(step===0){title='「夕飯の材料、ぼくが選んでみたい。」';body=speech('はる','いつもは頼まれたものを買ってるけど、今度は材料から自分で考えてみたい。',true)+'<p>まず親子で、この家のことを確かめます。学年だけで、できることを決めません。</p><div class="card"><b>一緒に暮らしている人</b><p>はる・父・母。祖母は別の家で暮らしています。</p><b>普段の生活</b><p>両親は働いています。家事をする人と時間は日によって違います。</p></div>'+button(s.familyConfirmed?'親子で確認しました':'この家族で合っているか、親と確認する','confirmFamily',null,s.familyConfirmed?'picked':'')+note('分からない情報は、家族に聞いてから足せます。祖母の参加は開始条件にしません。');disabled=!s.familyConfirmed;next='普段の役割を確かめる'}
if(step===1){title='「ごはんの準備、いつも誰がしている？」';body=speech('はる','お母さんが全部やっていると思っていた。',true)+button(s.seen.includes('roles')?'親に聞いた内容を表示中':'父と母に、普段の分担を聞く','roles',null,'primary')+(s.seen.includes('roles')?speech('親','この見本の家では、料理は'+context.cook+'、買物は'+context.shopper+'がすることが多い。日によって変わるね。')+select('この家庭で普段よく料理する人','cook',context.cook,[['父','父'],['母','母'],['日による','日による']])+select('普段よく買物する人','shopper',context.shopper,[['母','母'],['父','父'],['日による','日による']]):'')+note('子どもの見立てと、家族に確認した内容を区別します。役割を固定する設定ではありません。');disabled=!s.seen.includes('roles');next='今まで任されたことを確認する'}
if(step===2){title='「今までは、どこまでやったことがある？」';body=speech('母','どこで助けが必要か、一緒に決めよう。初めてのことは一緒にやればいい。')+select('親子で確認した、これまでの経験','level',context.level,[['one','頼まれた1品を買ったことがある'],['with','親と一緒に商品を選んだことがある']])+select('今回の買い足す予算','budget',context.budget,[[1000,'1,000円'],[1200,'1,200円']])+select('買物に出かけるルール','rule',context.rule,[['near','一人で行けるのは近所のA店。B店は親と一緒'],['together','初めての買物は、行きも帰りも親と一緒']])+select('本人だけで運ぶ重さの目安（親子の約束）','carry',context.carry,[[1.5,'1.5kgくらいまで'],[2,'2kgくらいまで']])+note('予算は今回の材料の買い足し分です。家にある材料の価値が0円という意味ではありません。');next='この家庭での最初の体験を見る'}
if(step===3){title='この家庭に合わせた、最初の一歩。';body='<div class="card soft"><b>はるの「やってみたい」</b><p>夕飯の材料から、自分で考えて買う。</p><b>親子で決めた範囲</b><p>3人の夕飯。買い足し予算'+context.budget+'円。調理は大人と一緒。</p><b>最初の進め方</b><p>'+(context.level==='with'?'まず親と在庫と買うものを確かめ、買物も一緒に進める。':'在庫と必要な量を確かめ、候補と行き方を自分で比べる。')+'</p><b>相談し直す条件</b><p>人数・予算・行く店が変わる時。運ぶ荷物が約束した範囲を超える時。</p></div>'+speech('はる','まず、家に何があるか見て、夕飯に何が必要か調べてみる。',true)+'<p>親子で確認した条件を、次の調査・実践へ引き継ぎます。</p>'+button('この条件で始めることを親子で決める','saveSetup',null,s.saved?'picked':'primary')+(s.saved?note('条件を確認した見本として残しました。②と③の予算・同行・荷物の条件が変わります。'):'')+'<details><summary>ここでレビューすること</summary><p>長いプロフィール入力をせずに、家庭ごとの体験が変わるか。初回の確認を後のクエストで聞き直していないか。親が全部の答えを準備する負担になっていないか。</p></details>';next='② 家庭を調べる体験へ';act='toResearch';disabled=!s.saved}
shell(place,title,body,next,act,disabled,4);
}
const sources={
work:{label:'父と母に聞いたこと',text:'父は物流の仕事で、お店へ届く荷物の段取りをする。母は会社の事務の仕事。二人とも勤務先から給料を受け取る。'},
money:{label:'親に見せてもらった、食費の使い方',text:'給料などを家計へ入れ、食費・住まい・光熱費・貯める分へ分けている。材料は食費から払う。給料の額は聞かなくてよい。'},
time:{label:'家族の予定と普段の分担',text:'在庫を確かめる・買う・料理・片付けは別の仕事。今日は16時45分までに材料が必要。父は16時30分に近所の店へ迎えに行ける。'},
stock:{label:'家の棚と冷蔵庫を見たこと',text:'米、玉ねぎ2個、にんじん1本、カレールー3人分がある。肉とじゃがいもはない。買う前に確かめると買い足すものが変わる。'}
};
function research(){
let body='',title='',next='次の場面へ',act='next',disabled=false;
if(step===0){title='「カレーって、買ってくるだけで食べられる？」';body=speech('はる','材料を買う人と、料理する人がいる。でもその前には、どんなことがあるんだろう。',true)+'<div class="scene">場面：土曜日の午後。次の買物を任される前に、夕飯ができるまでを調べます。</div><div class="card"><b>今回、自分で知りたいこと</b><p>誰の仕事・お金・時間で、夕飯が食卓に届くのか。</p></div>'+button(s.hint?'調べる観点を表示中':'何から調べればよいか、ヒントを見る','hint',null,'quiet')+(s.hint?'<div class="card soft"><b>調べるヒント · 用意済みの支援</b><p>① 誰が何をしている？<br>② お金はどこから来て、何に分けている？<br>③ 今回、家にあるものは？<br>家族に聞くことと、自分で見られるものを一つずつ選ぼう。</p></div>':'');next='聞く人・見るものを選ぶ'}
if(step===1){title='家族に聞く。家の中で確かめる。';body='<p>ボタンを押すと、その場所で調べた見本が開きます。答えをAIから受け取る場面ではありません。</p><div class="choices">'+Object.keys(sources).map(k=>button('<b>'+({work:'父と母の仕事を聞く',money:'食費の使い方を聞く',time:'予定と分担を確かめる',stock:'棚と冷蔵庫を見る'})[k]+'</b><small>'+(s.seen.includes(k)?'調べた情報があります':'まだ確かめていません')+'</small>','source',k,s.seen.includes(k)?'picked':'')).join('')+'</div>'+(s.activeSource?'<div class="card soft"><span class="tag">出所：'+sources[s.activeSource].label+'</span><p>'+sources[s.activeSource].text+'</p></div>':'')+note('最低限、家族に聞いた情報と、自分で見た情報を使って次を考える見本にしています。全てを調べる義務は実製品へ持ち込みません。');disabled=!(s.seen.includes('stock')&&s.seen.some(k=>k!=='stock'));next='分かったことを、自分でつなぐ'}

function price(){return s.store==='near'?{small:360,big:600,p2:160,p4:260,tom:200,roux:120}:{small:300,big:540,p2:150,p4:240,tom:180,roux:110}}
function plan(){
const p=price();const meatG=(s.meat==='small'?300:600)*s.meatCount;const potatoN=(s.potato==='small'?2:4)*s.potatoCount;
const curry=s.menu!=='野菜炒め';const needMeat=s.people===3?300:400;const needPotato=curry?(s.people===3?2:3):0;
const total=(s.meat==='small'?p.small:p.big)*s.meatCount+(curry?(s.potato==='small'?p.p2:p.p4)*s.potatoCount:0)+(s.side?p.tom:0)+(curry&&s.roux?p.roux:0);
const weight=((s.meat==='small'?.3:.6)*s.meatCount+(curry?(s.potato==='small'?.4:.8)*s.potatoCount:0)+(s.side?.4:0)+(curry&&s.roux?.2:0)+.1);
const travel=s.store==='near'?26:50;
const minutes=s.help==='meet'&&s.store==='near'?38:travel;
const returnTime='16:'+String(minutes).padStart(2,'0');
const errors=[];
if(!s.stock)errors.push('家にあるものを、まだ確かめていません。');
if(meatG<needMeat)errors.push('肉は'+needMeat+'g必要。今の買う量は'+meatG+'gです。');
if(potatoN<needPotato)errors.push('じゃがいもは'+needPotato+'個必要。今の買う量は'+potatoN+'個です。');
if(curry&&s.people>3&&!s.roux)errors.push('家のルーは3人分。4人で食べるなら買い足しも確かめます。');
if(total>s.budget)errors.push('予算を'+(total-s.budget)+'円超えています。内容を変えるか、親に相談できます。');
if(minutes>45)errors.push('16時45分に間に合う予定になっていません。');
if(s.store==='far')errors.push('B店は親と一緒に行く約束。今日は同行できる家族がいません。');
if(context.rule==='together'&&s.help!=='together')errors.push('今回は親と一緒に行く約束です。母の同行を相談できます。');
if(s.help==='meet'&&!s.asked.includes('pickup'))errors.push('父の迎えはまだ相談できていません。');
if(s.help==='together'&&!s.asked.includes('together'))errors.push('母の同行はまだ相談できていません。');
if(weight>context.carry&&s.help==='self')errors.push('荷物が親子で決めた重さの目安を超えます。運び方を相談できます。');
return {total,weight,meatG,potatoN,needMeat,needPotato,returnTime,errors,remaining:s.budget-total};
}

function ask(k){

const answers={pickup:['父','近所のA店なら16時30分に迎えに行ける。荷物を分けて運ぼう。B店までは今日は行けない。'],together:['母','A店なら16時から一緒に行けるよ。B店まで行く時間は今日はない。'],budget:['親','4人分に変わったから、買い足しは今回は1,200円までにしよう。次の買物の上限はまた相談しよう。'],side:['親','今日は主菜だけでもいいよ。家族みんなの分が足りるようにしよう。'],leftover:['父','肉が残るなら、帰ってから僕が保存を手伝えるよ。どれくらい残る予定か教えて。']};

if(k==='budget'){s.budget=1200;s.negotiated=true}if(k==='side')s.side=false;if(k==='leftover')s.leftover=true;
record('家族に相談：'+s.answer);render();
}

root.addEventListener('click',e=>{
const el=e.target.closest('button[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,v=el.dataset.value;
if(a==='start')start(Number(v));else if(a==='home'){scenario=-1;render()}else if(a==='next'){step++;render()}else if(a==='back'){step--;render()}else if(a==='hint'){s.hint=!s.hint;render()}else if(a==='confirmFamily'){s.familyConfirmed=true;record('同居：父・母・はる。祖母は別居と確認');render()}else if(a==='roles'){if(!s.seen.includes('roles'))s.seen.push('roles');record('親に普段の家事分担を聞いた');render()}else if(a==='saveSetup'){context.setup=true;s.saved=true;record('親子で範囲を決定：予算'+context.budget+'円、外出'+context.rule+'、荷物'+context.carry+'kg');render()}else if(a==='toResearch'){start(1)}else if(a==='source'){if(!s.seen.includes(v))s.seen.push(v);s.activeSource=v;record('調査：'+sources[v].label);render()}else if(a==='agree'){s.agreed=true;context.research=true;context.insight=s.claim;context.investigation=s.seen.slice();record('材料選びを任せてもらう相談をした');render()}else if(a==='toPractice'){start(2)}else if(a==='stock'){s.stock=true;record('棚と冷蔵庫で在庫を見た。米と野菜は家のものを使う');render()}else if(a==='changePeople'){s.people=4;s.changed=true;record('家族の連絡で3人から4人へ。必要量を見直す');render()}else if(a==='ask')ask(v);else if(a==='replan'){step=4;render()}else if(a==='purchase'){const q=plan();if(q.errors.length)return;s.receipt=true;record('本人が選択：'+s.menu+' '+s.people+'人分、'+(s.side?'サラダあり':'サラダなし')+'、'+q.total+'円、'+(s.store==='near'?'A店':'B店')+'、'+({self:'自分で運ぶ',meet:'父と待ち合わせ',together:'母と同行'})[s.help]);step=6;render()}else if(a==='voice'){s.voice=true;const q=plan();s.notebook='4人に変わったので、肉の量を見直した。'+(s.negotiated?'親に予算を相談した。':!s.side?'サラダは今回はやめることを家族に聞いた。':'')+(s.help==='meet'?'荷物は父に迎えを頼んで一緒に運んだ。':s.help==='together'?'母と一緒に買物に行って運んだ。':'自分で持てる量を運んだ。')+'買い足しは'+q.total+'円だった。';render()}else if(a==='finish'){record('本人の記録：'+(s.notebook||'今回は言葉を残さない'));record('祖母への共有：'+(s.shared?'親の確認待ち':'希望なし'));step=7;render()}else if(a==='export')exportLog();
});
root.addEventListener('input',e=>{const id=e.target.dataset.field;if(!id)return;if(['reason','proposal','notebook'].includes(id)){s[id]=e.target.value;if(id==='notebook'){const quote=document.getElementById('record-quote');if(quote)quote.textContent='残した言葉：'+(s.notebook||'未記録')}return}});
root.addEventListener('change',e=>{
const id=e.target.dataset.field;if(!id||['reason','proposal','notebook'].includes(id))return;const value=e.target.type==='checkbox'?e.target.checked:e.target.value;
if(scenario===0&&['cook','shopper','level','budget','rule','carry'].includes(id)){context[id]=['budget','carry'].includes(id)?Number(value):value;if(id==='level'&&value==='with')context.rule='together';s.saved=false}
else {s[id]=['meatCount','potatoCount'].includes(id)?Number(value):value;if(['store','meat','potato','meatCount','potatoCount','side','roux','help','menu'].includes(id))record('本人が変更：'+id+' = '+value)}
render();
});
document.getElementById('home').addEventListener('click',()=>{scenario=-1;render()});
document.getElementById('font').addEventListener('click',()=>{large=!large;document.body.classList.toggle('large',large);document.getElementById('font').setAttribute('aria-pressed',String(large))});
render();
window.YattemiReview={start:start,render:render,plan:plan,getState:()=>({scenario:scenario,step:step,s:s,context:context,history:history})};
})();
</script></body></html>
